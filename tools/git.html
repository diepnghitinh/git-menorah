<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Git</title>
<!--
  GitMenorah Git page. Open it through the server, not as a file:
    node tools/git-server.mjs      → http://127.0.0.1:4990
  ?git=<repo>&wt=<worktree> opens one repository; without it the page shows the project dashboard.
-->
<script>
  // Color mode in localStorage 'gitmenorah-theme': auto (follows the system) | light | dark.
  // Runs before the page paints; another tab changing the mode updates this one (storage event).
  (() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const m = localStorage.getItem('gitmenorah-theme');
      document.documentElement.dataset.theme = m === 'light' || m === 'dark' ? m : mq.matches ? 'dark' : 'light';
      window.onThemeChange?.();
    };
    window.applyTheme = apply;
    apply();
    mq.addEventListener('change', apply);
    addEventListener('storage', (e) => { if (e.key === 'gitmenorah-theme') apply(); });
  })();
</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e3e6eb; --border-strong:#cfd4dc;
    --text:#1b2330; --muted:#5d6878; --faint:#8a94a3;
    --accent:#1f6feb; --accent-soft:#e8f0fe;
    --ok:#1a7f4b; --ok-soft:#e6f4ec; --warn:#a66a00; --warn-soft:#fdf3e1;
    --danger:#c62f3a; --danger-soft:#fdecee;
    --term:#11151c; --term-text:#d7dde6; --term-faint:#6b7585;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:10px;
    --chip:#eef0f3; --sunken:#f3f5f8; --subtle:#fafbfc; --hover:#f4f6f9; --line:#eef0f3; --seg-on:#fff;
    --code-text:#2a3442; --info-text:#1a4fa8; --dot:#c4c9d1; --toast:#1b2330;
    --accent-hover:#185ccc; --danger-border:#efc2c6;
    --banner-border:#f1d3a1; --banner-text:#6b4500; --banner-code:#fff6e6;
    --scroll:#cfd5dd; --scroll-hover:#a9b1bc;
    --add-bg:#e8f6ee; --add-t:#0f5a36; --add-n:#d5efe0; --del-bg:#fdecee; --del-t:#97202c; --del-n:#f8d9dd;
    --hunk-bg:#f1f5fd; --hunk-t:#4a6aa5;
    --hl-k:#8a3fb8; --hl-s:#0f6b3d; --hl-c:#8a94a3; --hl-n:#a14f00; --hl-t:#1f5fbf;
    --mix-base:#fff; --mix-ink:#000; --shadow-c:16,24,40;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
  main{max-width:1280px;margin:0 auto;padding:28px 32px 64px}
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
  h2{font-size:14px;margin:0 0 12px;font-weight:650}
  .sub{color:var(--muted);font-size:13px}
  code,.mono{font-family:var(--mono);font-size:12.5px}

  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:20px;
    background:var(--chip);color:var(--muted);white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.err{background:var(--danger-soft);color:var(--danger)}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--panel);color:var(--text);padding:7px 14px;font-weight:550}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:var(--accent-hover);color:#fff}
  button.danger{color:var(--danger);border-color:var(--danger-border)}
  button.danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
  button.link{border:none;background:none;padding:2px 4px;color:var(--accent);font-weight:500}
  button.link:hover{text-decoration:underline}
  input[type=text]{font-family:inherit;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;
    padding:7px 10px;width:100%;color:var(--text);background:var(--panel)}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .chip{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--chip);color:var(--muted);white-space:nowrap}
  .chip.on{background:var(--accent-soft);color:var(--accent)}
  .chip.off{background:var(--sunken);color:var(--faint);text-decoration:line-through}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .seg{display:inline-flex;gap:2px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--sunken);margin-bottom:12px}
  .seg button{border:none;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-size:12.5px}
  .seg button:hover:not(:disabled){color:var(--text)}
  .seg button.active{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(var(--shadow-c),.08)}
  .faint{color:var(--faint)}
  .note{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .note.warn{color:var(--warn)}
  .note.err{color:var(--danger)}
  .panel[hidden]{display:none}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;font-size:13px;
    padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.show{opacity:1}

  /* ─── Git — layout after GitKraken: toolbar · left sidebar · commit graph · right panel ───
     A tool screen that needs the width for the graph, so it fills the whole window. */
  main{max-width:none;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0}
  #panelGit{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
  /* Thanh cuộn mảnh trong tab Git. Chrome/Safari dùng ::-webkit-scrollbar; Firefox dùng scrollbar-width. */
  #panelGit ::-webkit-scrollbar{width:6px;height:6px}
  #panelGit ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px}
  #panelGit ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
  #panelGit ::-webkit-scrollbar-track,#panelGit ::-webkit-scrollbar-corner{background:transparent}
  @supports not selector(::-webkit-scrollbar){#panelGit *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}}
  /* Tay kéo đổi cỡ: vạch 2px hiện khi rê chuột, như CompactTable. Bấm đúp để về cỡ mặc định. */
  .gk-rz{position:absolute;top:0;bottom:0;width:7px;z-index:6;cursor:col-resize}
  .gk-rz::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:transparent;transition:background .12s}
  .gk-rz:hover::after,.gk-rz.on::after{background:var(--accent)}
  .gk-rz[data-rz=side]{left:calc(var(--gk-side) - 2px)}
  .gk-rz[data-rz=right]{right:calc(var(--gk-right) - 5px)}
  .gk-ghead .gk-rz{right:0}
  .gk-ghead .gk-rz::after{left:5px}
  .gk-hrz{height:7px;margin:-4px 0 -3px;position:relative;z-index:3;cursor:row-resize;flex:none}
  .gk-hrz::after{content:'';position:absolute;left:0;right:0;top:3px;height:2px;background:transparent;transition:background .12s}
  .gk-hrz:hover::after,.gk-hrz.on::after{background:var(--accent)}
  body.gk-dragging,body.gk-dragging *{user-select:none!important}
  body.gk-dragging.col *{cursor:col-resize!important}
  body.gk-dragging.row *{cursor:row-resize!important}
  .gk-ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .gk-bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border);min-height:56px}
  .gk-pick{display:flex;align-items:center;gap:2px;min-width:0;flex:1 1 0}
  .gk-pick .dd{border:none;background:none;padding:4px 8px;border-radius:7px;display:flex;flex-direction:column;
    align-items:flex-start;line-height:1.3;min-width:0;max-width:300px;text-align:left}
  .gk-pick .dd:hover:not(:disabled){background:var(--hover);color:inherit}
  .gk-pick .lb{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
  .gk-pick .vl{font-size:13.5px;font-weight:650;display:flex;gap:5px;align-items:center;max-width:100%}
  .gk-pick .vl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gk-pick .vl .gk-ic{width:13px;height:13px;color:var(--faint)}
  .gk-pick .sep{color:var(--border-strong);font-size:18px}
  .gk-tools{display:flex;gap:2px;align-items:stretch}
  .gk-tool{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 9px;
    border-radius:8px;font-size:11.5px;color:var(--muted);font-weight:550;min-width:52px;position:relative;white-space:nowrap}
  .gk-tool .gk-ic{width:18px;height:18px}
  .gk-tool:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .gk-tool .bd{position:absolute;top:1px;right:4px;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--accent)}
  .gk-tool .bd.dn{color:var(--warn)}
  .gk-split{display:flex;align-items:stretch;border-radius:8px}
  .gk-split .gk-tool:first-child{border-radius:8px 0 0 8px;padding-right:4px}
  .gk-split .gk-tool.caret{min-width:0;padding:5px 4px;border-radius:0 8px 8px 0;justify-content:center}
  .gk-split .gk-tool.caret .gk-ic{width:12px;height:12px}
  .gk-bar-r{display:flex;align-items:center;gap:2px;flex:1 1 0;justify-content:flex-end;min-width:0}
  .gk-bar-r .sub{font-size:11.5px;color:var(--faint);margin-right:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .gk-prog{display:inline-block;width:64px;height:4px;margin-left:7px;border-radius:2px;background:var(--border);vertical-align:middle;overflow:hidden}
  .gk-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .gk-vsep{width:1px;align-self:stretch;background:var(--border);margin:6px 4px}
  .gk-home{border:none;background:none;padding:8px;border-radius:8px;color:var(--muted);line-height:0;margin-right:2px}
  .gk-home:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .gk-home.on{background:var(--accent-soft);color:var(--accent)}
  .gk-home .gk-ic{width:18px;height:18px}

  /* Tổng quan các project (?view=projects): thay chỗ đồ thị, cột giữa tối đa 1240px. */
  .gk-dash{display:none;flex:1;min-height:0;overflow:auto;background:var(--bg)}
  #panelGit.dash .gk-body{display:none}
  #panelGit.dash .gk-dash{display:block}
  .gd-wrap{max-width:1240px;margin:0 auto;padding:28px 32px 48px}
  .gd-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
  .gd-head .t{flex:1;min-width:0}
  .gd-acts{display:flex;gap:8px}
  .gd-head h2{font-size:20px;margin:0 0 2px;font-weight:650}
  .gd-head .sub{font-size:12.5px;color:var(--faint)}
  .gd-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:28px}
  @media (max-width:1100px){.gd-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
  button.gd-tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:13px 16px;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);text-align:left;color:var(--text);font-weight:400}
  button.gd-tile:hover:not(:disabled){border-color:var(--border-strong);color:var(--text)}
  button.gd-tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .gd-tile .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .gd-tile .k i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .gd-tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
  .gd-tile .s{font-size:12px;color:var(--faint)}
  .gd-proj{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
  .gd-ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .gd-ph .t{flex:1;min-width:0}
  .gd-ph h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
  .gd-ph .p{font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .gd-ph .st{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:6px}
  .gd-ph button{padding:5px 12px;font-size:12.5px}
  .gd-ph button.more{padding:5px 7px;line-height:0}
  .gd-scroll{overflow-x:auto}
  .gd-t{width:100%;border-collapse:collapse;font-size:13px}
  .gd-t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:650;text-align:left;
    padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .gd-t td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .gd-t tr:last-child td{border-bottom:none}
  .gd-t tbody tr[data-open]{cursor:pointer}
  .gd-t tbody tr[data-open]:hover td{background:var(--hover)}
  .gd-t th:first-child,.gd-t td:first-child{padding-left:18px}
  .gd-t .nm{font-weight:600}
  .gd-t .br{font-family:var(--mono);font-size:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .gd-t .f{color:var(--faint)}
  .gd-t .w{color:var(--warn)}
  .gd-t .lc{max-width:300px;overflow:hidden;text-overflow:ellipsis}
  .gd-t .subj{color:var(--muted);margin-left:6px}
  .gd-t tr.wt td{background:var(--subtle);font-size:12.5px;padding-top:7px;padding-bottom:7px}
  .gd-t tr.wt td:first-child{padding-left:40px}
  .gd-t tr.wt[data-open]:hover td{background:var(--hover)}
  button.gd-wtb{border:none;background:none;padding:2px 6px;margin-left:-6px;display:inline-flex;align-items:center;gap:4px;
    color:var(--muted);font-weight:500}
  button.gd-wtb:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .gd-wtb .gk-ic{width:13px;height:13px;transition:transform .12s}
  .gd-wtb.shut .gk-ic{transform:rotate(-90deg)}
  .gd-t td.rm{width:1px;padding:4px 10px 4px 0}
  button.gd-rm{border:none;background:none;padding:4px;line-height:0;color:var(--faint);opacity:0}
  .gd-t tr:hover button.gd-rm,button.gd-rm:focus-visible{opacity:1}
  button.gd-rm:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .gd-rm .gk-ic{width:14px;height:14px}
  .gd-empty{padding:56px 24px;text-align:center;color:var(--faint)}

  .gk-body{--gk-side:240px;--gk-right:380px;position:relative;flex:1;min-height:0;display:grid;
    grid-template-columns:var(--gk-side) minmax(0,1fr) var(--gk-right)}
  @media (max-width:1280px){.gk-body{--gk-side:210px;--gk-right:330px}}
  .gk-side{border-right:1px solid var(--border);overflow:hidden auto;padding:8px 0 16px;background:var(--subtle);font-size:12.5px}
  .gk-filter{margin:0 10px 6px;position:relative}
  .gk-filter input[type=text]{padding:5px 8px 5px 27px;font-size:12.5px}
  .gk-filter .gk-ic{position:absolute;left:8px;top:8px;width:13px;height:13px;color:var(--faint)}
  .gk-sec{margin-top:4px}
  .gk-sidetabs{display:flex;gap:2px;margin:0 10px 8px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
  .gk-sidetabs[hidden]{display:none}
  .gk-sidetabs button{flex:1;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0}
  .gk-sidetabs button:hover{color:var(--text)}
  .gk-sidetabs button.on{background:var(--panel, var(--bg));color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .gk-sidetabs .n{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--faint)}
  .gk-sidetabs .n.run{color:var(--ok)}
  .gk-ag{display:grid;grid-template-columns:8px 16px minmax(0,1fr) auto;align-items:center;column-gap:6px;padding:4px 12px 4px 28px;cursor:pointer;user-select:none}
  .gk-ag:hover{background:var(--hover)}
  .gk-ag .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .gk-ag .dot.running{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .gk-ag .dot.idle{background:var(--accent)}
  .gk-ag .mk,.gk-menu .mk{width:16px;height:16px;border-radius:4px;font:700 10px/16px var(--mono);text-align:center;color:#fff;background:#5d6878}
  .gk-ag .mk.claude,.gk-menu .mk.claude{background:#d97757}
  .gk-ag .mk.codex,.gk-menu .mk.codex{background:#1b2330}
  .gk-menu .mk{display:inline-block;vertical-align:-3px;margin-right:8px}
  .gk-ag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .gk-ag .w{color:var(--faint);font-size:11px}
  .gk-ag .ln{grid-column:3/5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11.5px}
  .gk-ag .sub{color:var(--ok);font-size:11px}
  /* Đầu worktree hai dòng: tên trên, nhánh rút gọn dưới; không rớt chữ, chỉ cắt bằng "…" */
  .gk-agh{align-items:flex-start;padding:5px 8px 5px 12px;margin-top:2px}
  .gk-agh > .gk-ic{margin-top:3px}
  .gk-agh .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .gk-agh .tx .nm{flex:none;font-weight:600}
  .gk-agh .tx .br{overflow:hidden;text-overflow:ellipsis;color:var(--faint);font-family:var(--mono);font-size:10.5px}
  .gk-agh.empty{cursor:default}
  .gk-agh.empty .gk-tw{visibility:hidden}
  .gk-agh.empty .tx .nm{font-weight:500;color:var(--muted)}
  .gk-agh > .w{margin-top:1px;padding:0 6px;border-radius:8px;background:var(--chip);font:500 10.5px/16px var(--mono)}
  .gk-agh > .w.run{color:var(--ok);background:var(--ok-soft)}
  /* Nút + chỉ hiện khi rê chuột, chiếm chỗ của số đếm để tên worktree đủ rộng */
  .gk-agadd{flex:none;width:20px;height:20px;padding:0;display:none;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:5px;background:none;color:var(--muted)}
  .gk-agh:hover .gk-agadd{display:inline-flex}
  .gk-agh:hover > .w{display:none}
  .gk-agadd:hover{color:var(--text);background:var(--panel);border-color:var(--border)}
  .gk-agadd .gk-ic{width:13px;height:13px}
  .gk-sec-h{display:flex;align-items:center;gap:5px;padding:6px 12px 3px;font-size:10.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
  .gk-sec-h:hover{color:var(--text)}
  .gk-sec-h .n{margin-left:auto;font-weight:500;color:var(--faint);font-family:var(--mono);letter-spacing:0}
  .gk-sec-h .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Sort button of Worktrees: opens a menu with the orders. Same box as + */
  .gk-sort{flex:none;width:18px;height:18px;margin-left:auto;padding:0;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:5px;background:none;color:var(--muted)}
  .gk-sort:hover:not(:disabled){color:var(--text);background:var(--panel);border-color:var(--border)}
  .gk-sort .gk-ic{width:12px;height:12px}
  .gk-sort + .n{margin-left:6px}
  /* Nút + ở tiêu đề mục Worktrees: tạo worktree mới từ cây chính */
  .gk-sec-add{flex:none;width:18px;height:18px;margin-left:auto;padding:0;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:5px;background:none;color:var(--muted)}

  .gk-tw{width:10px;height:10px;color:var(--faint);transition:transform .12s}
  .gk-tw.shut{transform:rotate(-90deg)}
  .gk-item{display:flex;align-items:center;gap:6px;padding:2px 12px;cursor:pointer;white-space:nowrap;min-height:24px;user-select:none}
  .gk-item:hover{background:var(--hover)}
  .gk-item.sel{background:var(--accent-soft)}
  .gk-item.cur{font-weight:650}
  .gk-item .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}

  .gk-item.cur > .gk-ic{color:var(--ok)}

  .gk-side .gd-empty{padding:2px 12px 4px 28px}

  .gk-main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
  .gk-ghead,.gk-row{display:grid;grid-template-columns:var(--gk-cols,200px 60px minmax(0,1fr) 120px 112px)}
  .gk-ghead{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;

  .gk-ghead > div{padding:0 10px;white-space:nowrap;overflow:hidden;position:relative}

  .gk-scroll{flex:1;min-height:0;overflow:auto;position:relative}
  .gk-rows{position:relative}
  .gk-svg{position:absolute;top:0;left:var(--gk-refw,200px);width:var(--gk-gw,60px);pointer-events:none;overflow:hidden}
  .gk-row{height:28px;align-items:center;font-size:12.5px;cursor:pointer}
  .gk-row:hover{background:var(--hover)}
  .gk-row.sel{background:var(--accent-soft)}

  .gk-row.wip .msg b{font-weight:650;color:var(--text);margin-right:8px}

  .gk-ref{display:inline-flex;align-items:center;gap:4px;min-width:0;font-size:11.5px;line-height:18px;padding:0 7px;border-radius:5px;
    border:1px solid color-mix(in srgb,var(--c) 45%,var(--mix-base));background:color-mix(in srgb,var(--c) 11%,var(--mix-base));
    color:color-mix(in srgb,var(--c) 78%,var(--mix-ink));font-weight:600;cursor:pointer}
  .gk-ref span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .gk-ref.tag{background:var(--panel);border-style:dashed}
  .gk-ref .gk-ic{width:11px;height:11px;stroke-width:2.2}
  .gk-ref-more{font-size:11px;color:var(--faint);flex:none;font-family:var(--mono)}
  .gk-more{padding:10px;text-align:center}
  .gk-graph-empty{padding:40px;text-align:center;color:var(--faint)}

  .gk-right{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
  .gk-rhead{padding:12px 14px 10px;border-bottom:1px solid var(--border);font-size:13px}

  .gk-rhead .ln1 .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gk-rhead code{font-size:12px}
  .seg.sm{margin:0}
  .seg.sm button{padding:2px 8px;font-size:11.5px}
  .gk-right .gd-op,.gk-right .gd-ro{margin:10px 14px 0;font-size:12.5px}
  .gk-sect{display:flex;flex-direction:column;min-height:0;flex:1 1 0}
  .gk-hrz + .gk-sect{border-top:1px solid var(--border)}
  .gk-sect-h{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 14px;background:var(--subtle);border-bottom:1px solid var(--border);
    font-size:12px;font-weight:650;color:var(--muted)}
  .gk-sect-h .n{font-weight:500;color:var(--faint)}
  .gk-sect-h .spacer{flex:1}
  .gk-sect-h button{padding:2px 9px;font-size:11.5px}
  .gk-files{overflow:auto;flex:1;min-height:56px;padding:4px 0}
  .gk-files .gd-empty{padding:8px 14px}
  .gk-file{display:flex;align-items:center;gap:7px;padding:2px 10px 2px 14px;font-size:12.5px;cursor:pointer;min-height:25px}
  .gk-file:hover{background:var(--hover)}
  .gk-file.sel{background:var(--accent-soft)}
  .gk-file .st{width:16px;height:16px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;
    place-items:center;flex:none;background:var(--chip);color:var(--muted)}
  .gk-file .st.M{background:var(--warn-soft);color:var(--warn)}
  .gk-file .st.A{background:var(--ok-soft);color:var(--ok)}
  .gk-file .st.D{background:var(--danger-soft);color:var(--danger)}

  .gk-file .st.U{background:var(--danger);color:#fff}
  .gk-file .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gk-file .p .d{color:var(--faint)}
  .gk-file.dir{color:var(--muted);font-weight:600}
  .gk-file.dir > .gk-ic{width:13px;height:13px;color:var(--faint)}
  .gk-file.dir > .gk-tw{width:10px;height:10px;margin-right:-3px}
  .gk-file.dir .n{font-weight:500;color:var(--faint);font-size:11px}
  button.gk-fold{padding:2px 4px;line-height:0;color:var(--muted)}
  .gk-fold .gk-ic{width:13px;height:13px}
  .gk-file .act{visibility:hidden;font-size:11px;padding:0 8px;line-height:19px;flex:none}
  .gk-file:hover .act,.gk-file.sel .act{visibility:visible}
  .gk-file .act.drop{margin-right:4px}
  .gk-file .act.drop:hover:not(:disabled){color:var(--danger);border-color:var(--danger-border);background:var(--danger-soft)}
  .gk-commit{border-top:1px solid var(--border);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--subtle);flex:none}
  .gk-commit .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .gk-commit .row .spacer{flex:1}
  .gk-commit .cnt.over{color:var(--warn)}
  /* Cao của ô Description do tay kéo phía trên khung Commit (gitUi.sz.commit); khung tự cao theo. */
  .gk-commit textarea{font-family:inherit;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;
    resize:none;min-height:60px;color:var(--text);background:var(--panel)}
  .gk-commit textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .gk-commit .note{margin:0}
  .gk-commit .ident{gap:6px;min-width:0}
  .gk-commit .ident .gk-av{width:18px;height:18px;font-size:8.5px}
  .gk-commit .ident .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .gk-commit .ident .who.unset{color:var(--warn)}
  .gk-commit .ident .sub{flex:none}
  .gk-commit .gen{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:12px;line-height:20px}
  .gk-commit .gen .gk-ic{width:14px;height:14px}
  .gk-commit .gen.busy{color:var(--accent);border-color:var(--accent);opacity:1;cursor:progress}
  .gk-commit .gen.busy .gk-ic{animation:gkGenPulse 1.1s ease-in-out infinite}
  @keyframes gkGenPulse{50%{opacity:.35;transform:scale(.8)}}
  .gk-info{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;overflow:auto;max-height:46%}
  .gk-info .sha{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .gk-info .sha code{color:var(--accent)}
  .gk-info .sha .par{cursor:pointer}
  .gk-info .sha .par:hover{text-decoration:underline}
  .gk-info .subj{font-size:14px;font-weight:650;margin:8px 0 4px;word-break:break-word}
  .gk-info .body{white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .gk-info .auth{display:flex;align-items:center;gap:9px;margin-top:10px}
  .gk-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
  .gk-info .auth .sub{font-size:12px}
  .gk-info .acts{display:flex;gap:6px;margin-top:10px}

  .gk-diff{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:3}
  .gk-diff[hidden]{display:none}
  .gk-diff-h{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;border-bottom:1px solid var(--border);font-size:13px;min-height:44px}
  .gk-diff-h .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px;font-weight:600}
  .gk-diff-h button{padding:4px 11px;font-size:12px}
  .gk-diff-b{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.6;padding-bottom:20px}
  .gk-diff-b .msg{padding:30px;text-align:center;color:var(--faint);font-family:var(--sans);font-size:13px}
  .gk-diff-b .msg.secret{color:var(--warn)}
  .dl{display:grid;grid-template-columns:46px 46px minmax(0,1fr)}
  .dl .n{color:var(--faint);text-align:right;padding-right:8px;user-select:none;font-size:11px}
  .dl .t{white-space:pre-wrap;word-break:break-all;padding-left:8px}
  .dl.add{background:var(--add-bg)} .dl.add .t{color:var(--add-t)} .dl.add .n{background:var(--add-n)}
  .dl.del{background:var(--del-bg)} .dl.del .t{color:var(--del-t)} .dl.del .n{background:var(--del-n)}
  .dl.hunk{background:var(--hunk-bg);color:var(--hunk-t);margin-top:6px}
  .dl.meta .t{color:var(--faint)}
  .gk-diff-h .seg.sm{flex:none}
  .gk-tip{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--border);border-radius:9px;pointer-events:none;
    box-shadow:0 12px 32px rgba(var(--shadow-c),.16);padding:10px 12px;font-size:12.5px;width:max-content;max-width:440px}
  .gk-tip .h{font-weight:650;margin-bottom:6px}
  .gk-tip dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0}
  .gk-tip dt{color:var(--faint)}
  .gk-tip dd{margin:0;word-break:break-all}
  .gk-tip .rel{color:var(--muted)}
  .gk-tip .ft{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px}
  .gk-diff-b.web{padding:0;overflow:hidden;display:flex}
  /* Trang web của tệp luôn nền trắng: tệp tự vẽ màu của nó, không theo chế độ tối. */
  .gk-web{flex:1;width:100%;border:0;background:#fff}
  /* Chế độ Files (gitUi.mode): cây tệp | tab tệp | lịch sử tệp — thay chỗ đồ thị, giống VS Code. */
  .gk-ex{--ex-side:260px;--ex-right:300px;display:none;position:relative;flex:1;min-height:0;
    grid-template-columns:var(--ex-side) minmax(0,1fr) var(--ex-right)}
  #panelGit.files .gk-body{display:none}
  #panelGit.files .gk-ex{display:grid}
  #panelGit.dash .gk-ex{display:none}
  .gk-ex .gk-rz[data-rz=exside]{left:calc(var(--ex-side) - 2px)}
  .gk-ex .gk-rz[data-rz=exright]{right:calc(var(--ex-right) - 5px)}
  .ex-side,.ex-log{display:flex;flex-direction:column;min-height:0;background:var(--subtle);font-size:12.5px}
  .ex-side{border-right:1px solid var(--border)}
  .ex-log{border-left:1px solid var(--border)}
  .ex-h{display:flex;align-items:center;gap:2px;padding:8px 6px 6px 12px;min-height:36px}
  .ex-h b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ex-h button{border:none;background:none;padding:4px;border-radius:6px;color:var(--muted);line-height:0}
  .ex-h button:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .ex-h .gk-ic{width:15px;height:15px}
  .ex-side .gk-filter{margin:0 10px 6px}
  .ex-tree{flex:1;overflow:auto;padding-bottom:16px}
  .ex-it{display:flex;align-items:center;gap:5px;height:24px;padding-right:10px;cursor:pointer;white-space:nowrap;color:var(--text);user-select:none}
  .ex-it:hover{background:var(--hover)}
  .ex-it.on{background:var(--accent-soft)}
  .ex-it .gk-ic{width:14px;height:14px;color:var(--faint)}
  .ex-it .gk-tw{width:12px;height:12px}
  .ex-it .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ex-it .dir{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ex-it .mk{margin-left:auto;padding-left:6px;font:600 11px/1 var(--mono)}
  .ex-it .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .ex-M{color:var(--warn)!important} .ex-U,.ex-A{color:var(--ok)!important} .ex-D,.ex-C{color:var(--danger)!important} .ex-R{color:var(--accent)!important}
  .ex-it.ex-D .nm{text-decoration:line-through}
  .ex-note{padding:10px 14px;color:var(--faint);font-size:12px}
  .ex-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
  .ex-tabs{display:flex;overflow-x:auto;overflow-y:hidden;background:var(--subtle);border-bottom:1px solid var(--border);flex:none;min-height:35px}
  .ex-tabs::-webkit-scrollbar{height:3px!important}
  .ex-tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;height:35px;border-right:1px solid var(--border);font-size:12.5px;
    color:var(--muted);cursor:pointer;white-space:nowrap;flex:none;max-width:260px;user-select:none}
  .ex-tab .nm{overflow:hidden;text-overflow:ellipsis}
  .ex-tab .sha{font:11px var(--mono);color:var(--faint)}
  .ex-tab .gk-ic{width:13px;height:13px}
  .ex-tab .x{border:none;background:none;padding:2px;border-radius:4px;color:var(--faint);line-height:0;visibility:hidden}
  .ex-tab .x .gk-ic{width:12px;height:12px}
  .ex-tab:hover .x,.ex-tab.on .x{visibility:visible}
  .ex-tab .x:hover{background:var(--hover);color:var(--text)}
  .ex-tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent);margin-bottom:-1px}
  .ex-crumb{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);min-height:32px;flex:none}
  .ex-crumb .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ex-crumb .p i{font-style:normal;color:var(--border-strong);margin:0 5px}
  .ex-crumb .p span:last-child{color:var(--text)}
  .ex-crumb button{padding:2px 9px;font-size:11.5px}
  .ex-crumb .meta{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .ex-body{flex:1;overflow:auto;min-height:0}
  .ex-body .msg{padding:40px 30px;text-align:center;color:var(--faint);font-size:13px}
  .ex-body .msg.secret{color:var(--warn)}
  .ex-body.diff{font-family:var(--mono);font-size:12px;line-height:1.6;padding-bottom:20px}
  .ex-code{display:flex;min-width:max-content;font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:6px 0 24px}
  .ex-code pre{margin:0;font:inherit;white-space:pre;tab-size:2}
  .ex-code .ln{position:sticky;left:0;background:var(--panel);color:var(--faint);text-align:right;padding:0 14px 0 12px;user-select:none;min-width:52px}
  .ex-code .src{padding-right:40px;color:var(--code-text)}
  .ex-img{padding:24px;display:grid;place-items:center}
  .ex-md{max-width:900px;margin:0 auto;padding:20px 32px 48px;font-size:14px;line-height:1.65;color:var(--text);overflow-wrap:break-word}
  .ex-md>:first-child{margin-top:0}
  .ex-md h1,.ex-md h2,.ex-md h3,.ex-md h4,.ex-md h5,.ex-md h6{margin:26px 0 12px;line-height:1.3;font-weight:600}
  .ex-md h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
  .ex-md h2{font-size:1.45em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
  .ex-md h3{font-size:1.2em} .ex-md h4{font-size:1em} .ex-md h5{font-size:.9em} .ex-md h6{font-size:.85em;color:var(--muted)}
  .ex-md p,.ex-md ul,.ex-md ol,.ex-md blockquote,.ex-md pre,.ex-md .tbl{margin:0 0 14px}
  .ex-md ul,.ex-md ol{padding-left:2em} .ex-md li+li{margin-top:3px} .ex-md li>ul,.ex-md li>ol{margin:3px 0 0}
  .ex-md li.task{list-style:none} .ex-md li.task input{margin:0 6px 0 -1.4em;vertical-align:-1px}
  .ex-md a{color:var(--accent);text-decoration:none} .ex-md a:hover{text-decoration:underline}
  .ex-md code{font-family:var(--mono);font-size:.86em;background:var(--chip);padding:.15em .4em;border-radius:5px}
  .ex-md pre{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;line-height:1.5}
  .ex-md pre code{background:none;padding:0;font-size:12.5px;color:var(--code-text)}
  .ex-md blockquote{padding:0 14px;border-left:3px solid var(--border-strong);color:var(--muted)}
  .ex-md hr{border:none;border-top:1px solid var(--border);margin:24px 0}
  .ex-md img{max-width:100%;border-radius:4px;vertical-align:middle}
  .ex-md video{display:block;max-width:100%;margin:0 0 14px;border-radius:6px;background:#000}
  .ex-md .tbl{overflow:auto}
  .ex-md table{border-collapse:collapse;font-size:13px}
  .ex-md th,.ex-md td{border:1px solid var(--border);padding:6px 12px}
  .ex-md th{background:var(--subtle);font-weight:600} .ex-md tbody tr:nth-child(2n) td{background:var(--subtle)}
  .ex-img img{max-width:100%;background:repeating-conic-gradient(var(--chip) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
  .hl-k{color:var(--hl-k)} .hl-s{color:var(--hl-s)} .hl-c{color:var(--hl-c);font-style:italic} .hl-n{color:var(--hl-n)} .hl-t{color:var(--hl-t)}
  .ex-empty{flex:1;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;padding:30px}
  .ex-empty kbd{font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--subtle)}
  .ex-loglist{flex:1;overflow:auto;padding:0 6px 16px}
  .ex-c{display:block;width:100%;text-align:left;border:none;background:none;border-radius:7px;padding:6px 8px;color:var(--text);font-weight:400}
  .ex-c:hover:not(:disabled){background:var(--hover);color:var(--text)}
  .ex-c.on{background:var(--accent-soft)}
  .ex-c .s{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .gk-hist{border-top:1px solid var(--border);background:var(--subtle);flex:none}

  /* Chế độ tối: chỉ đổi biến màu. data-theme do đoạn script đầu <head> đặt (Theo hệ thống / Sáng / Tối). */

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-dev-runner': '1' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
// navigator.clipboard is missing outside a secure context and rejected in an iframe without
// allow="clipboard-write"; execCommand('copy') still works inside the click that asked for it.
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); return toast(msg); } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  const prev = document.activeElement;
  document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); prev?.focus?.();
  toast(ok ? msg : 'Clipboard blocked by the browser');
}

// ── Color mode: the menu sits in the Git toolbar. ──
const THEME_STORE = 'gitmenorah-theme';
const themeMode = () => ['light', 'dark'].includes(localStorage.getItem(THEME_STORE)) ? localStorage.getItem(THEME_STORE) : 'auto';
function setTheme(m) {
  localStorage.setItem(THEME_STORE, m);
  applyTheme();
}
window.onThemeChange = () => {
  gkRenderBar();
  gtRetheme();
};

// ─── Tab Git ───────────────────────────────────────────────────────────────

// Kéo: nghe ở document chứ không capture trên tay kéo — poll 10 giây vẽ lại khung phải giữa lúc kéo vẫn không đứt.
$('panelGit').addEventListener('pointerdown', (e) => {

  let from = 0, box = null, top = 0;

  } else if (k === 'term' || k === 'hist') {

function since(sec) {
  const m = Math.round((Date.now() / 1000 - sec) / 60);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
}
function gkWhen(sec) {
  if (Date.now() / 1000 - sec < 7 * 86400) return since(sec);
  const d = new Date(sec * 1000), p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}
const gkFull = (sec) => new Date(sec * 1000).toLocaleString('en-GB');
const clock = (ms) => new Date(ms).toTimeString().slice(0, 8);
const wtShort = (rel) => rel.replace(/^\.worktrees\//, '');
// Worktree phụ: mặc định tạo sau cùng lên đầu; 'az' = theo tên. Cây chính luôn đứng trên cùng, không xếp.
const gkSortedWts = (wts) => [...wts].sort(gitUi.wtSort === 'az'
  ? (a, b) => wtShort(a.rel).localeCompare(wtShort(b.rel), 'vi', { numeric: true })
  : (a, b) => (b.created || 0) - (a.created || 0) || wtShort(a.rel).localeCompare(wtShort(b.rel)));
const abMini = (a, b) => (a || b ? `<span class="ab">${a ? `<span class="up">↑${a}</span>` : ''}${a && b ? ' ' : ''}${b ? `<span class="down">↓${b}</span>` : ''}</span>` : '');
const trackAB = (t) => [+(/ahead (\d+)/.exec(t || '')?.[1] || 0), +(/behind (\d+)/.exec(t || '')?.[1] || 0)];

function abHtml(s) {
  if (!s || s.error) return '';
  if (!s.upstream) return s.branch ? '<span class="ab">no upstream</span>' : '';
  if (!s.ahead && !s.behind) return '<span class="ab">up to date</span>';
  return abMini(s.ahead, s.behind);
}

function gitBadges(r) {
  const s = r.status || {}, out = [];
  if (r.readOnly) out.push('<span class="chip ro">read-only</span>');
  if (s.error) out.push('<span class="chip err">error</span>');
  if (s.op) out.push(`<span class="chip err">${esc(s.op)} in progress</span>`);
  if (s.conflicts) out.push(`<span class="chip err">${s.conflicts} conflicted</span>`);
  else if (s.tracked) out.push(`<span class="chip warn" title="Uncommitted tracked files">${s.tracked} modified</span>`);
  out.push(abHtml(s));
  return out.join(' ');
}

// Remote có thể tên "a/b" — tách theo danh sách remote thật, lấy tên dài nhất khớp.
function gkRemoteOf(name) {
  return (gitD?.remotes || []).filter((r) => name.startsWith(r + '/')).sort((a, b) => b.length - a.length)[0] || null;
}

// ── Tải dữ liệu ──
async function gitLoadList(refresh) {
  try {
    const [list, g] = await Promise.all([api('/api/git/repos' + (refresh ? '?refresh=1' : '')), api('/api/git/groups')]);
    gitList = list; gitGroups = g.groups;
  } catch (e) { return gkEmpty(e.message); }
  const r0 = gitSel && gitList.find((r) => r.id === gitSel.repo);
  if (!r0) gitSel = gitList[0] ? { repo: gitList[0].id, wt: '' } : null;
  else if (gitSel.wt && !r0.worktrees.some((w) => w.rel === gitSel.wt)) gitSel.wt = '';
  if (!gitSel) return gkEmpty('No git repositories found in this project.');
  await gitLoadDetail();
}

// Đọc chi tiết mỗi lần poll; chỉ đọc lại đồ thị và vẽ lại khi trạng thái đổi (commit,
// checkout ở terminal hay GUI git…). `gitSig = ''` để ép đọc lại.
let gitSeq = 0;
async function gitLoadDetail() {
  const seq = ++gitSeq;
  const key = `${gitSel.repo}|${gitSel.wt || ''}`;
  if (key !== gitKey) {
    gitKey = key; gitSig = ''; gitN = 300; gitPick = null; gitInfo = null; gitDiffOpen = null;
    gitD = null; gitG = null; gitRows = []; gitTips = new Map();
    gkRenderAll();
  }
  const q = new URLSearchParams({ repo: gitSel.repo, wt: gitSel.wt || '' });
  let d;
  try { d = await api('/api/git/detail?' + q); } catch (e) { if (key === gitKey && seq === gitSeq) gkEmpty(e.message); return; }
  if (key !== gitKey || seq !== gitSeq) return;
  const sig = JSON.stringify([d.status, d.branches, d.stash, d.fetchedAt, d.worktrees, d.submodules, d.identity, gitN]);
  if (sig === gitSig && gitG) {
    gitD = d; gkRenderBar();
    if (gitDiffOpen && !gitDiffOpen.sha) gkLoadDiff(true);   // sửa tiếp tệp đã sửa: trạng thái không đổi, nội dung đổi
    if (gitUi.mode === 'files') exLoad();
    return;
  }
  let g;
  try { g = await api('/api/git/graph?' + q + '&n=' + gitN); } catch (e) { g = { commits: [], more: false, error: e.message }; }
  if (key !== gitKey || seq !== gitSeq) return;
  gitSig = sig; gitD = d; gitG = g;
  gitRows = gkLayout(g.commits);
  gitTips = gkTipMap(g.commits);
  const dirty = d.status.files?.length > 0;
  if (gitPick === 'wip' && !dirty) gitPick = null;
  if (gitPick && gitPick !== 'wip' && !g.commits.some((c) => c.h === gitPick) && !d.stash.some((x) => x.hash === gitPick)) gitPick = null;
  if (!gitPick) gitPick = dirty ? 'wip' : d.status.oid || null;
  gkRenderAll();
  if (gitDiffOpen && !gitDiffOpen.sha) gkSyncDiff();
  if (gitPick && gitPick !== 'wip' && gitInfo?.sha !== gitPick) gkLoadInfo();
  if (gitUi.mode === 'files') exLoad();
}

function gkEmpty(msg) {
  gitD = null; gitG = null; gitRows = [];
  gkRenderAll();
  $('gkRows').innerHTML = `<div class="gk-graph-empty">${esc(msg)}</div>`;
}

async function gkLoadInfo() {
  const sha = gitPick, key = gitKey;
  try {
    const inf = await api('/api/git/commit?' + new URLSearchParams({ repo: gitSel.repo, wt: gitSel.wt || '', sha }));
    if (gitPick !== sha || key !== gitKey) return;
    gitInfo = inf;
  } catch (e) {
    if (gitPick !== sha || key !== gitKey) return;
    gitInfo = { sha, error: e.message };
  }
  gkRenderRight();
}

// ── Đồ thị ──
// Xếp làn: mỗi làn giữ sha của commit nó đang chờ. Không nén làn khi làn trống — đường
// không xô ngang giữa chừng, đổi lại đồ thị rộng hơn một chút.
function gkLayout(commits) {
  const lanes = [], rows = [];
  const free = (skip) => { const k = lanes.findIndex((x, j) => x == null && j !== skip); return k < 0 ? lanes.length : k; };
  for (const c of commits) {
    let col = lanes.indexOf(c.h);
    if (col < 0) col = free(-1);
    for (let j = 0; j < lanes.length; j++) if (lanes[j] === c.h) lanes[j] = null;   // các làn chờ commit này gộp về đây
    lanes[col] = c.p[0] || null;
    const out = [];
    for (const p of c.p.slice(1)) {
      let k = lanes.indexOf(p), fresh = false;
      if (k < 0) { k = free(col); lanes[k] = p; fresh = true; }
      out.push({ k, fresh });
    }
    while (lanes.length && lanes[lanes.length - 1] == null) lanes.pop();
    rows.push({ c, col, out, after: lanes.slice() });
  }
  return rows;
}

function gkTipMap(commits) {
  const m = new Map();
  for (const c of commits) for (let r of (c.refs || '').split(', ')) {
    if (!r || r === 'HEAD' || r.startsWith('tag: ')) continue;
    if (r.startsWith('HEAD -> ')) r = r.slice(8);
    if (!m.has(r)) m.set(r, c.h);
  }
  return m;
}

function gkGraphSvg(off, w, h, headIdx) {
  const X = (j) => 10 + j * GK_LANE, Y = (i) => (i + off) * GK_ROW + GK_ROW / 2;
  const paths = GK_COLORS.map(() => []);
  const seg = (j, x1, y1, x2, y2) => {
    const ym = (y1 + y2) / 2;
    paths[j % GK_COLORS.length].push(x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${ym} ${x2} ${ym} ${x2} ${y2}`);
  };
  gitRows.forEach((r, i) => {
    const nx = gitRows[i + 1], y1 = Y(i), y2 = nx ? Y(i + 1) : h;   // hàng cuối: kéo thẳng xuống mép
    const target = (j, sha) => (nx && sha === nx.c.h ? nx.col : j);
    const fresh = new Set(r.out.filter((o) => o.fresh).map((o) => o.k));
    r.after.forEach((sha, j) => {
      if (sha == null) return;
      seg(j, X(j === r.col || fresh.has(j) ? r.col : j), y1, X(target(j, sha)), y2);
    });
    // Cha thứ hai đã có làn chờ sẵn: nối từ commit sang làn đó.
    for (const o of r.out) if (!o.fresh && o.k !== r.col) seg(o.k, X(r.col), y1, X(target(o.k, r.after[o.k])), y2);
  });
  let wip = '';
  if (off) {
    const hc = headIdx >= 0 ? gitRows[headIdx].col : 0, x = X(hc);
    wip = `<path d="M${x} ${GK_ROW / 2}V${headIdx >= 0 ? Y(headIdx) : h}" stroke="#8a94a6" stroke-dasharray="3 3"/>
      <circle cx="${x}" cy="${GK_ROW / 2}" r="5" style="fill:var(--panel)" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="2.5 2"/>`;
  }
  const nodes = gitRows.map((r, i) => {
    const c = GK_COLORS[r.col % GK_COLORS.length], x = X(r.col), y = Y(i);
    if (i === headIdx) return `<circle cx="${x}" cy="${y}" r="6.5" style="fill:var(--panel)" stroke="${c}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="3.5" fill="${c}"/>`;
    return r.c.p.length > 1 ? `<circle cx="${x}" cy="${y}" r="3.5" fill="${c}"/>` : `<circle cx="${x}" cy="${y}" r="4.5" fill="${c}" style="stroke:var(--panel)" stroke-width="1.5"/>`;
  }).join('');
  return `<svg class="gk-svg" width="${w}" height="${h}">
    <g fill="none" stroke-width="2" stroke-linecap="round">${paths.map((p, j) => (p.length ? `<path d="${p.join('')}" stroke="${GK_COLORS[j]}"/>` : '')).join('')}${wip}</g>${nodes}</svg>`;
}

function gkRefs(str) {
  const d = gitD, local = new Set(d.branches.local.map((b) => b.name)), out = [], remotes = [], tags = [];
  let detached = false;
  for (let r of (str || '').split(', ')) {
    if (!r) continue;
    if (r === 'HEAD') { detached = true; continue; }
    if (r.startsWith('HEAD -> ')) r = r.slice(8);
    if (r.startsWith('tag: ')) { tags.push(r.slice(5)); continue; }
    if (r.endsWith('/HEAD')) continue;
    if (local.has(r)) out.push({ name: r, kind: 'local', cur: r === d.status.branch, also: [] });
    else remotes.push(r);
  }
  // Nhánh remote cùng tên gộp vào pill nhánh cục bộ (đám mây = remote cũng đang ở đây).
  for (const rn of remotes) {
    const rm = gkRemoteOf(rn), l = rm && out.find((x) => x.name === rn.slice(rm.length + 1));
    if (l) l.also.push(rn); else out.push({ name: rn, kind: 'remote', also: [rn] });
  }
  if (detached) out.unshift({ name: 'HEAD', kind: 'head', cur: true, also: [] });
  for (const t of tags) out.push({ name: t, kind: 'tag', also: [] });
  return out.sort((a, b) => (b.cur ? 1 : 0) - (a.cur ? 1 : 0));
}

function gkRefsHtml(str, color) {
  const refs = gkRefs(str);
  if (!refs.length) return '';
  const pill = (x) => `<span class="gk-ref ${x.cur ? 'cur' : ''} ${x.kind === 'tag' ? 'tag' : ''}" style="--c:${color}" data-ref="${esc(x.name)}" data-kind="${x.kind}"
    title="${esc([x.name, ...x.also.filter((a) => a !== x.name)].join(' · '))}">${x.kind === 'tag' ? ic('tag') : x.cur ? ic('check') : ''}<span>${esc(x.name)}</span>${x.also.length ? ic('cloud') : ''}</span>`;
  const more = refs.length - 1;
  return pill(refs[0]) + (more ? `<span class="gk-ref-more" title="${esc(refs.slice(1).map((x) => x.name).join('\n'))}">+${more}</span>` : '');
}

function gkWipCounts(s) {
  const st = s.files.filter((f) => f.xy !== '??' && f.xy !== 'UU' && f.xy[0] !== '.').length;
  const un = s.files.filter((f) => f.xy === '??' || f.xy === 'UU' || f.xy[1] !== '.').length;
  return [un && `${un} unstaged`, st && `${st} staged`, s.conflicts && `${s.conflicts} conflicted`].filter(Boolean).join(' · ');
}

function gkRenderGraph() {
  const rowsEl = $('gkRows');
  $('gkMore').innerHTML = '';
  if (!gitD) { rowsEl.innerHTML = '<div class="gk-graph-empty">Loading repository…</div>'; return; }
  const s = gitD.status;
  if (s.error) { rowsEl.innerHTML = `<div class="gk-graph-empty">${esc(s.error)}</div>`; return; }
  const off = s.files.length ? 1 : 0;
  const lanes = Math.max(1, ...gitRows.map((r) => Math.max(r.after.length, r.col + 1)));
  const full = 20 + lanes * GK_LANE;
  gitLanesW = Math.max(64, Math.min(full, 280));   // không hẹp hơn chữ tiêu đề "Đồ thị"
  gkApplyCols();
  if (!gitRows.length && !off) {
    rowsEl.innerHTML = `<div class="gk-graph-empty">${esc(gitG?.error || 'This repository has no commits yet.')}</div>`;
    return;
  }
  const headIdx = gitRows.findIndex((r) => r.c.h === s.oid);
  const h = (gitRows.length + off) * GK_ROW;
  const m = gitMsgs[gitKey];
  const wip = off ? `<div class="gk-row wip ${gitPick === 'wip' ? 'sel' : ''}" data-sha="wip"><div class="refs"></div><div></div>
    <div class="msg"><b>// WIP</b><span class="wipmsg">${esc(m?.summary || gkWipCounts(s))}</span></div><div class="who"></div><div class="when"></div></div>` : '';
  rowsEl.style.height = h + 'px';
  rowsEl.innerHTML = gkGraphSvg(off, full, h, headIdx) + wip + gitRows.map((r, i) => {
    const c = r.c;
    return `<div class="gk-row ${gitPick === c.h ? 'sel' : ''} ${i === headIdx ? 'head' : ''}" data-sha="${c.h}">
      <div class="refs">${gkRefsHtml(c.refs, GK_COLORS[r.col % GK_COLORS.length])}</div><div></div>
      <div class="msg" title="${esc(c.s)}">${esc(c.s)}</div><div class="who">${esc(c.a)}</div>
      <div class="when" title="${esc(gkFull(c.t))}">${gkWhen(c.t)}</div></div>`;
  }).join('');
  if (gitG?.more) $('gkMore').innerHTML = `<div class="gk-more"><button class="link" data-more="1">Load 300 older commits</button></div>`;
}

function gkSwitchTo(name, remote) {
  if (!remote) {
    const b = gitD.branches.local.find((x) => x.name === name);

    if (b.wtPath && b.wtPath !== gitD.dir) return gkSelectWtPath(b.wtPath);
  }
  gitAct('switch', { branch: name });

let gkMenuEl = null;
function gitMenuClose() { gkMenuEl?.remove(); gkMenuEl = null; }
function gitMenu(at, items) {
  gitMenuClose();
  items = items.filter(Boolean);
  const hasCk = items.some((it) => it.check !== undefined);
  const acts = [];
  const m = document.createElement('div');
  m.className = 'gk-menu';
  m.innerHTML = items.map((it) => {
    if (it === '-') return '<hr>';
    if (it.hd) return `<div class="hd">${esc(it.hd)}</div>`;
    acts.push(it);
    return `<button class="it ${it.danger ? 'danger' : ''}" data-i="${acts.length - 1}" ${it.disabled ? 'disabled' : ''} ${it.title ? `title="${esc(it.title)}"` : ''}>
      ${hasCk ? `<span class="ck">${it.check ? ic('check') : ''}</span>` : ''}<span class="lb">${it.html || esc(it.label)}</span>${it.sub ? `<span class="sb">${esc(it.sub)}</span>` : ''}</button>`;
  }).join('').replace(/^(<hr>)+|(<hr>)+$/g, '');
  document.body.appendChild(m);
  const r = at.getBoundingClientRect ? at.getBoundingClientRect() : { left: at.clientX, top: at.clientY, bottom: at.clientY };
  let x = r.left, y = r.bottom + 4;
  if (x + m.offsetWidth > innerWidth - 8) x = Math.max(8, innerWidth - m.offsetWidth - 8);
  if (y + m.offsetHeight > innerHeight - 8) y = Math.max(8, r.top - m.offsetHeight - 4);
  m.style.left = x + 'px';
  m.style.top = y + 'px';
  m.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (!b || b.disabled) return;
    gitMenuClose();
    acts[+b.dataset.i].act();
  });
  gkMenuEl = m;
}
document.addEventListener('mousedown', (e) => { if (gkMenuEl && !gkMenuEl.contains(e.target)) gitMenuClose(); }, true);
document.addEventListener('scroll', (e) => { if (gkMenuEl && !gkMenuEl.contains(e.target)) gitMenuClose(); }, true);
addEventListener('resize', gitMenuClose);
addEventListener('blur', gitMenuClose);

// ── Thanh trái ──
function gkRenderSide() {
  const el = $('gkTree');
  if (!gitD || gitD.status.error) { el.innerHTML = ''; return; }
  const d = gitD, cur = d.status.branch, q = $('gkFilter').value.trim().toLowerCase();
  const match = (...xs) => !q || xs.some((x) => (x || '').toLowerCase().includes(q));
  const tw = (shut) => ic('down', 'gk-tw' + (shut ? ' shut' : ''));
  const isShut = (k) => !q && gitClosed.has(k);
  const pad = (depth) => `style="padding-left:${12 + depth * 14}px"`;
  const sec = (key, title, count, body, extra = '') => `<div class="gk-sec"><div class="gk-sec-h" data-sec="${key}">${tw(isShut(key))}<span class="t">${esc(title)}</span>${extra}<span class="n">${count}</span></div>${isShut(key) ? '' : body}</div>`;
  // Cây theo dấu "/": feat/a, feat/b → thư mục feat. Lá xếp trước thư mục, cùng loại xếp theo tên.
  const tree = (items, prefix, leaf, depth) => {
    const dirs = new Map(), leaves = [];
    for (const it of items) {
      const i = it.rest.indexOf('/');
      if (i < 0) leaves.push(it);
      else {
        const k = it.rest.slice(0, i);
        if (!dirs.has(k)) dirs.set(k, []);
        dirs.get(k).push({ ...it, rest: it.rest.slice(i + 1) });
      }
    }
    let html = leaves.sort((a, b) => a.rest.localeCompare(b.rest)).map((it) => leaf(it, depth)).join('');
    for (const [k, list] of [...dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
      const key = prefix + k + '/';
      html += `<div class="gk-item dir" data-sec="${esc(key)}" ${pad(depth)}>${tw(isShut(key))}${ic('folder')}<span class="nm">${esc(k)}</span><span class="w">${list.length}</span></div>`;
      if (!isShut(key)) html += tree(list, key, leaf, depth + 1);
    }
    return html;
  };
  const brLeaf = (remote) => (it, depth) => {
    const b = it.b, held = !remote && b.wtPath && b.wtPath !== d.dir, isCur = !remote && b.name === cur;
    const [a, bh] = trackAB(b.track);
    const tip = []
      .concat(b.name, !remote && b.upstream ? `tracking ${b.upstream}` : [], held ? `open at ${b.wtPath}` : [], 'Double-click to switch · right-click for more');
    return `<div class="gk-item ${isCur ? 'cur' : ''} ${gitTips.get(b.name) && gitTips.get(b.name) === gitPick ? 'sel' : ''}" data-br="${esc(b.name)}" ${remote ? 'data-remote="1"' : ''}
      style="padding-left:${28 + depth * 14}px" title="${esc(tip.join('\n'))}">${ic(isCur ? 'check' : 'branch')}<span class="nm">${esc(it.rest)}</span>${
      b.track === '[gone]' ? '<span class="w">remote gone</span>' : abMini(a, bh)}${held ? ic('folder', 'wtmark') : ''}</div>`;
  };

  const local = d.branches.local.filter((b) => match(b.name));
  const localHtml = local.length ? tree(local.map((b) => ({ rest: b.name, b })), 'L:', brLeaf(false), 0) : '<div class="gd-empty">No matching branches.</div>';

  const remoteHtml = d.remotes.map((rm) => {
    const list = d.branches.remote.filter((b) => gkRemoteOf(b.name) === rm && match(b.name));
    if (!list.length && q) return '';
    const key = 'R:' + rm + '/';
    return `<div class="gk-item dir" data-sec="${esc(key)}" ${pad(0)}>${tw(isShut(key))}${ic('cloud')}<span class="nm">${esc(rm)}</span><span class="w">${list.length}</span></div>`
      + (isShut(key) ? '' : tree(list.map((b) => ({ rest: b.name.slice(rm.length + 1), b })), key, brLeaf(true), 1));
  }).join('') || '<div class="gd-empty">No remotes.</div>';

  const main = gitList.find((x) => x.id === d.id)?.status || {};
  const wtItem = (rel, label, branch, a, b, dirty, created) => (match(label, branch) ? `<div class="gk-item ${(gitSel.wt || '') === rel ? 'sel cur' : ''}" data-wt="${esc(rel)}"
    style="padding-left:28px" data-path="${esc(rel ? join2(d.mainPath, rel) : d.mainPath)}" data-created="${created ?? ''}">${ic('folder')}<span class="nm">${esc(label)}</span><span class="w">${esc(branch || 'detached')}</span>${
    abMini(a, b)}${dirty ? `<span class="chip warn" title="Uncommitted tracked files">${dirty}</span>` : ''}</div>` : '');
  const wtHtml = wtItem('', 'main worktree', main.branch, main.ahead, main.behind, main.tracked, d.mainCreated)
    + gkSortedWts(d.worktrees).map((w) => wtItem(w.rel, wtShort(w.rel), w.branch, w.ahead, w.behind, w.tracked, w.created)).join('');
  // Sort button: a click opens a menu with the orders (gkSortMenu).
  const sortTip = `Sort worktrees: ${gitUi.wtSort === 'az' ? 'name (A–Z)' : 'newest first'}`;
  const wtSort = d.worktrees.length > 1
    ? `<button class="gk-sort" data-wtsort title="${sortTip}" aria-label="${sortTip}" aria-haspopup="menu">${ic('sort')}</button>` : '';
  const wtAdd = d.readOnly ? '' : `<button class="gk-sec-add" data-wtnew title="New worktree…" ${gitBusy ? 'disabled' : ''}>${ic('plus')}</button>`;

  const stashHtml = d.stash.filter((x) => match(x.subject)).map((x) => `<div class="gk-item ${gitPick === x.hash ? 'sel' : ''}" data-stash="${x.hash}"
    style="padding-left:28px" title="${esc(x.ref + ' · ' + x.subject)}">${ic('stash')}<span class="nm">${esc(x.subject)}</span><span class="w">${since(+x.when)}</span></div>`).join('')
    || '<div class="gd-empty">No stashes.</div>';

  const SUB = { moved: '<span class="chip warn">commit differs</span>', uninit: '<span class="chip ro">not initialized</span>', conflict: '<span class="chip err">conflict</span>' };
  const subHtml = d.submodules.filter((x) => match(x.path)).map((x) => `<div class="gk-item" style="padding-left:28px;cursor:default"
    title="${esc(`${x.path} @ ${x.sha}${x.desc ? ' (' + x.desc + ')' : ''}`)}">${ic('box')}<span class="nm">${esc(x.path)}</span>${SUB[x.state] || `<span class="w">${esc(x.sha)}</span>`}</div>`).join('');

  el.innerHTML = sec('S:local', 'Local branches', d.branches.local.length, localHtml)
    + sec('S:remote', 'Remotes', d.branches.remote.length, remoteHtml)
    + sec('S:wt', 'Worktrees', d.worktrees.length + 1, wtHtml, wtSort + wtAdd)
    + sec('S:stash', 'Stashes', d.stash.length, stashHtml)
    + (d.submodules.length ? sec('S:sub', 'Submodules', d.submodules.length, subHtml) : '');
  gkRenderAgents();
}
const join2 = (a, b) => a.replace(/\/$/, '') + '/' + b;

// ── Tab Agents ở cột trái: chỉ có khi trang này nhúng trong GitMenorah ──

if (window.parent !== window) {

    const r = e.target.closest('[data-node]');

const GT_ANSI = {

    black: '#1b2330', red: '#f2707a', green: '#4cc38a', yellow: '#e0a83a', blue: '#4c8dff', magenta: '#c38cf2', cyan: '#4cc3c3', white: '#d7dde6',
    brightBlack: '#6b7585', brightRed: '#ff8f97', brightGreen: '#6fdca6', brightYellow: '#f2c46a', brightBlue: '#7aabff', brightMagenta: '#d6aaf7', brightCyan: '#7adada', brightWhite: '#ffffff',
  },
  light: {
    black: '#1b2330', red: '#c62f3a', green: '#1a7f4b', yellow: '#a66a00', blue: '#1f6feb', magenta: '#8a3ffc', cyan: '#0e7c86', white: '#8a94a3',
    brightBlack: '#5d6878', brightRed: '#d63a46', brightGreen: '#22995c', brightYellow: '#b8860b', brightBlue: '#185ccc', brightMagenta: '#9b59e0', brightCyan: '#12919c', brightWhite: '#3a4554',

const gtOpen = () => !!gitUi.histOpen && gkPanel() === 'term';

const gtActive = () => GT.tabs.find((t) => t.id === GT.active) || null;
function gtLabel(cwd) {
  const r = gitList.find((x) => x.real && (cwd === normPath(x.real) || cwd.startsWith(normPath(x.real) + '/')));
  if (!r) return cwd.split('/').pop() || cwd;

// Thư mục đang xem; ở màn Projects (chưa chọn repo) là thư mục project — app điền khi mở shell.
const gtRoot = () => exRoot() || GT.home;

function gtLib() {
  return GT.lib ||= new Promise((ok, fail) => {

    css.rel = 'stylesheet'; css.href = '/vendor/xterm/css/xterm.css';
    document.head.append(css);
    const files = ['xterm/lib/xterm.js', 'addon-fit/lib/addon-fit.js', 'addon-unicode11/lib/addon-unicode11.js', 'addon-web-links/lib/addon-web-links.js'];

  for (const x of keep) gtAdd(x.id, x.cwd, false);

if (window.parent !== window) {

  const btn = (label) => (act ? `<button class="act" data-act="${act}" ${ctx.lock || ''}>${label}</button>` : '');
  // Unstaged: Discard đứng trước Stage. Tệp xung đột thì sửa hoặc Abort, không discard.
  const drop = (f) => (act === 'stage' && (!f || f.st !== 'U') ? `<button class="act drop" data-act="discard" ${ctx.lock || ''} title="Throw away these changes">Discard</button>` : '');
  const ST_TITLE = { M: 'modified', A: 'added', D: 'deleted', R: 'renamed', C: 'copied', U: 'conflicted', T: 'type changed' };
  const fileRow = (f, depth, name) => `<div class="gk-file ${isSel(f.path) ? 'sel' : ''}" data-path="${esc(f.path)}" data-staged="${ctx.staged ? 1 : 0}" data-st="${esc(f.st)}"
    ${ctx.sha ? `data-sha="${ctx.sha}"` : ''} style="padding-left:${14 + depth * 14}px" title="${esc(f.from ? `${f.from} → ${f.path}` : f.path)}">
    <span class="st ${f.st}" title="${ST_TITLE[f.st] || ''}">${f.st}</span><span class="p">${name}</span>${f.secret
      ? '<span class="chip warn" title="Untracked secret file — add it to .gitignore. This page will not stage it.">secret</span>'
      : drop(f) + btn(f.st === 'U' ? 'Mark resolved' : ctx.staged ? 'Unstage' : 'Stage')}</div>`;
  if (gitUi.view !== 'tree') {
    return files.map((f) => {
      const i = f.path.lastIndexOf('/');
      return fileRow(f, 0, (i >= 0 ? `<span class="d">${esc(f.path.slice(0, i + 1))}</span>` : '') + esc(f.path.slice(i + 1)));
    }).join('');
  }
  // Cây: gom theo thư mục, nén chuỗi thư mục chỉ có một con (src/app/x thành một dòng).
  const root = { dirs: new Map(), files: [] };
  for (const f of files) {
    let n = root;
    for (const p of f.path.split('/').slice(0, -1)) {
      if (!n.dirs.has(p)) n.dirs.set(p, { dirs: new Map(), files: [] });
      n = n.dirs.get(p);
    }
    n.files.push(f);
  }
  const all = (n) => [...n.files.filter((f) => !f.secret).map((f) => f.path), ...[...n.dirs.values()].flatMap(all)];
  const out = [];
  const count = (n) => n.files.length + [...n.dirs.values()].reduce((x, c) => x + count(c), 0);
  const pre = ctx.sha ? 'c:' : ctx.staged ? 's:' : 'u:';
  // hidden: đang nằm dưới một thư mục gập — vẫn đi hết để Gập hết biết mọi thư mục, chỉ không vẽ.
  const walk = (n, depth, base, hidden) => {
    for (let [name, c] of [...n.dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
      while (c.dirs.size === 1 && !c.files.length) { const [[k, v]] = c.dirs; name += '/' + k; c = v; }
      const key = pre + base + name, shut = gkFileShut.has(key);
      gkDirKeys.add(key);
      if (!hidden) {
        const id = 'd' + gkDirFiles.size;
        gkDirFiles.set(id, all(c));
        out.push(`<div class="gk-file dir" style="padding-left:${14 + depth * 14}px" data-dir="${id}" data-key="${esc(key)}" title="${esc(base + name)}">${ic('down', 'gk-tw' + (shut ? ' shut' : ''))}${ic('folder')}<span class="p">${esc(name)}${shut ? ` <span class="n">${count(c)}</span>` : ''}</span>${drop()}${btn(ctx.staged ? 'Unstage' : 'Stage')}</div>`);
      }
      walk(c, depth + 1, base + name + '/', hidden || shut);
    }
    if (!hidden) for (const f of n.files) out.push(fileRow(f, depth, esc(f.path.slice(f.path.lastIndexOf('/') + 1))));
  };
  walk(root, 0, '', false);
  return out.join('');
}

function gkWipHtml() {
  const d = gitD, s = d.status, lock = gitBusy || d.readOnly ? 'disabled' : '';
  const un = [], st = [];
  for (const f of s.files) {
    if (f.xy === '??') un.push({ path: f.path, st: 'A', secret: !!f.secret });
    else if (f.xy === 'UU') un.push({ path: f.path, st: 'U' });
    else {
      if (f.xy[1] !== '.') un.push({ path: f.path, st: f.xy[1] });
      if (f.xy[0] !== '.') st.push({ path: f.path, from: f.orig, st: f.xy[0] });
    }
  }
  const m = gitMsgs[gitKey] || {};
  return `<div class="gk-rhead"><div class="ln1"><span class="t"><b>${s.filesTotal}</b> changed file${s.filesTotal === 1 ? '' : 's'} on <code>${esc(s.branch || 'detached HEAD')}</code></span>${gkViewSeg()}</div>
      ${s.filesTotal > s.files.length ? `<div class="sub" style="margin-top:4px">Showing the first ${s.files.length} files only.</div>` : ''}</div>
    ${gkBanners()}
    <div class="gk-sect" style="flex:${gkSplit()} 1 0"><div class="gk-sect-h">Unstaged <span class="n">${un.length}</span><span class="spacer"></span>${un.some((f) => f.st !== 'U' && !f.secret) ? `<button class="danger" data-all="discard" ${lock} title="Throw away every unstaged change">Discard all</button>` : ''}${un.length ? `<button data-all="stage" ${lock}>Stage all</button>` : ''}</div>
      <div class="gk-files">${gkFiles(un, { staged: false, empty: 'No unstaged files.', lock })}</div></div>
    <div class="gk-hrz" data-rz="split" title="Drag to resize · double-click to split evenly"></div>
    <div class="gk-sect" style="flex:${1 - gkSplit()} 1 0"><div class="gk-sect-h">Staged <span class="n">${st.length}</span><span class="spacer"></span>${st.length ? `<button data-all="unstage" ${lock}>Unstage all</button>` : ''}</div>
      <div class="gk-files">${gkFiles(st, { staged: true, empty: 'No staged files.', lock })}</div></div>
    <div class="gk-hrz" data-rz="commit" title="Drag to resize · double-click to reset"></div>
    <div class="gk-commit">
      <div class="row"><b style="color:var(--text)">Commit</b><span class="spacer"></span><span class="cnt" id="gkSumCnt"></span>${gkGenButton()}</div>
      <input type="text" id="gkSum" placeholder="Summary (required)" value="${esc(m.summary || '')}" maxlength="200" autocomplete="off" spellcheck="false" />
      <textarea id="gkDesc" rows="3" style="${gkDescH()}" placeholder="Description (optional)">${esc(m.desc || '')}</textarea>

function gkInitials(n) {
  const w = (n || '?').trim().split(/\s+/);
  return ((w.length > 1 ? w[w.length - 2][0] : '') + w[w.length - 1][0]).toUpperCase();
}
function gkAvColor(n) {
  let h = 0;
  for (const ch of n || '') h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 42% 46%)`;
}

function gkDescHtml() {
  const sha = gitPick, stash = gitD.stash.find((x) => x.hash === sha), inf = gitInfo?.sha === sha ? gitInfo : null;
  const head = `<div class="gk-rhead"><div class="ln1"><span class="t">${stash ? `<b>${esc(stash.ref)}</b>` : 'Commit'} <code>${sha.slice(0, 8)}</code></span></div></div>`;
  if (!inf) return head + gkBanners() + '<div class="gk-files"><div class="gd-empty">Loading commit…</div></div>';
  if (inf.error) return head + gkBanners() + `<div class="gk-files"><div class="gd-empty">${esc(inf.error)}</div></div>`;
  const lock = gitBusy || gitD.readOnly ? 'disabled' : '';
  const files = inf.files.map((f) => ({ path: f.path, from: f.from, st: f.st[0] }));
  return `${gkBanners()}<div class="gk-info">
      <div class="sha">${stash ? `<b>${esc(stash.ref)}</b> ·` : 'commit'} <code>${sha.slice(0, 8)}</code><button class="link" data-copy="${sha}">Copy</button>
        ${inf.parents.length ? `<span>· cha</span>${inf.parents.map((p) => `<code class="par" data-par="${p}" title="Xem commit cha">${p.slice(0, 7)}</code>`).join(' ')}` : ''}</div>
      <div class="subj">${esc(inf.subject)}</div>
      ${inf.body ? `<div class="body">${esc(inf.body)}</div>` : ''}
      <div class="auth"><span class="gk-av" style="background:${gkAvColor(inf.author)}">${esc(gkInitials(inf.author))}</span>
        <div><div>${esc(inf.author)}</div><div class="sub">${esc(gkFull(inf.when))}${inf.committer !== inf.author ? ` · committed by ${esc(inf.committer)}` : ''}</div></div></div>
      <div class="acts">${stash ? `<button class="primary" data-git="pop-this" data-hash="${stash.hash}" ${lock}>Pop this stash</button>`
        : `<button data-git="branch-here" ${lock}>New branch here…</button>`}</div>
      ${stash ? '<div class="note">Untracked files in this stash are not listed below, but they are restored on pop.</div>' : ''}
    </div>
    <div class="gk-sect"><div class="gk-sect-h">${files.length} changed file${files.length === 1 ? '' : 's'} ${inf.parents.length > 1 ? '<span class="n">vs. first parent</span>' : ''}<span class="spacer"></span>${gkViewSeg()}</div>
      <div class="gk-files">${gkFiles(files, { sha, empty: 'This commit changes no files.' })}</div></div>`;
}

function gkRenderRight() { keepFocus($('gkRight'), gkRenderRightNow); }
function gkRenderRightNow() {
  const el = $('gkRight');
  if (!gitD || gitD.status.error) { el.innerHTML = ''; return; }
  const tops = [...el.querySelectorAll('.gk-files')].map((x) => x.scrollTop);
  gkDirFiles.clear();
  gkDirKeys.clear();
  el.innerHTML = gitPick === 'wip' ? gkWipHtml() : gitPick ? gkDescHtml() : gkBanners() + '<div class="gk-files"><div class="gd-empty">Select a commit.</div></div>';
  el.querySelectorAll('.gk-files').forEach((x, i) => { x.scrollTop = tops[i] || 0; });
  gkFoldSync(el);
  gkCommitState();
}
function gkFoldSync(el) {
  const open = [...gkDirKeys].some((k) => !gkFileShut.has(k));
  for (const b of el.querySelectorAll('.gk-fold')) {
    b.hidden = !gkDirKeys.size;
    b.dataset.tree = open ? 'shut' : 'open';
    b.title = open ? 'Collapse all folders' : 'Expand all folders';
    b.innerHTML = ic(open ? 'fold' : 'unfold');
  }
}

function gkCommitReason() {
  const d = gitD, s = d.status, m = gitMsgs[gitKey] || {};
  const n = s.files.filter((f) => f.xy !== '??' && f.xy !== 'UU' && f.xy[0] !== '.').length;
  if (d.readOnly) return [n, 'Read-only repository.'];
  if (s.detached) return [n, 'Detached HEAD — create a branch before committing.'];
  if (d.protectedBranch) return [n, `${s.branch} only accepts changes through a pull request — create a feat branch and commit there.`];
  if (s.op) return [n, `${s.op} in progress — resolve the conflicts, then click Continue above.`];
  if (!d.identity?.email) return [n, 'Set your name and email for commits first — click Set… above.'];
  if (!n) return [0, 'Stage at least one file to commit.'];
  if (!(m.summary || '').trim()) return [n, 'Enter a summary to commit.'];
  return [n, ''];
}
function gkCommitState() {
  const btn = $('gkCommit');
  if (!btn) return;
  const [n, why] = gkCommitReason();
  const sum = gitMsgs[gitKey]?.summary || '';
  btn.disabled = !!why || gitBusy;
  btn.textContent = n ? `Commit ${n} file${n > 1 ? 's' : ''}` : 'Commit';
  $('gkGen').disabled = !n || gitGen.has(gitKey) || !!gitD.readOnly;
  $('gkCommitNote').textContent = why;
  $('gkCommitNote').hidden = !why;
  $('gkSumCnt').textContent = sum.length ? `${sum.length}/72` : '';
  $('gkSumCnt').classList.toggle('over', sum.length > 72);
  $('gkSumCnt').title = sum.length > 72 ? 'Keep the summary under 72 characters — GitHub and git log truncate the rest' : '';
  const w = document.querySelector('#gkRows .gk-row.wip .wipmsg');
  if (w) w.textContent = sum || gkWipCounts(gitD.status);
}
// Tên + email ghi vào commit: dòng "Committing as …" trong khung Commit, bấm Change… để sửa
// cho riêng repo này (.git/config) hoặc cho mọi repo (~/.gitconfig).
function gkIdentRow() {
  const id = gitD.identity || {};
  if (!id.email) return `<div class="row ident"><span class="who unset">No name &amp; email set for commits</span><span class="spacer"></span><button class="link" data-ident>Set…</button></div>`;
  const who = `${id.name || '(no name)'} <${id.email}>`;
  return `<div class="row ident"><span class="gk-av" style="background:${gkAvColor(id.name || id.email)}">${esc(gkInitials(id.name || id.email))}</span>
    <span class="who" title="Commits are written as ${esc(who)}">${esc(who)}</span>
    <span class="sub" title="${id.local ? "Set in this repository's .git/config — overrides your global setting" : 'From your global ~/.gitconfig'}">· ${id.local ? 'this repo' : 'global'}</span>
    <span class="spacer"></span><button class="link" data-ident title="Change the name and email written into your commits">Change…</button></div>`;
}
async function gkIdentityDialog() {
  const id = gitD.identity || { global: {} }, sel = gitSel;
  const f = { scope: id.local ? 'repo' : 'global' };
  // Đổi phạm vi thì điền sẵn giá trị đang có ở phạm vi đó (global trống thì giữ thứ PO đang gõ).
  const fill = (root) => {
    const src = f.scope === 'repo' ? id : id.global;
    if (src.name) root.querySelector('#idName').value = src.name;
    if (src.email) root.querySelector('#idEmail').value = src.email;
    root.querySelector('#idNote').textContent = f.scope === 'repo'
      ? `Saved in ${gitD.label}'s .git/config (all its worktrees) — other repositories keep their own setting.`
      : `Saved in ~/.gitconfig — used by every repository that has no setting of its own.${id.local ? ` ${gitD.label}'s own setting is removed so it uses this one too.` : ''}`;
  };
  await gitDialog({
    title: 'Name & email for commits', ok: 'Save', focus: '#idName',
    html: `<div class="gk-form">
      <div class="row"><span class="lbl">Use for</span><div class="seg" id="idScope">
        <button data-scope="repo" class="${f.scope === 'repo' ? 'active' : ''}">This repository</button><button data-scope="global" class="${f.scope === 'global' ? 'active' : ''}">All repositories</button></div></div>
      <div class="row"><span class="lbl">Name</span><input type="text" id="idName" maxlength="100" placeholder="Your Name" autocomplete="name" spellcheck="false" value="${esc(id.name || '')}" /></div>
      <div class="row"><span class="lbl">Email</span><input type="text" id="idEmail" maxlength="200" placeholder="you@example.com" autocomplete="email" spellcheck="false" value="${esc(id.email || '')}" /></div>
      <div class="gd-check"><span id="idNote"></span></div>
      <div class="gd-check"><span>Only new commits use it — commits already made keep their author.</span></div></div>`,
    mount: (root, okB) => {
      fill(root);
      root.querySelector('#idScope').onclick = (e) => {
        const b = e.target.closest('[data-scope]');

        f.scope = b.dataset.scope;
        for (const x of root.querySelectorAll('[data-scope]')) x.classList.toggle('active', x === b);
        fill(root);

      for (const i of root.querySelectorAll('input')) i.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) okB.click(); };
