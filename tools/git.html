// Nút Generate: Claude viết summary + description từ diff đã stage (server gọi `claude -p`).
// Nháp đang gõ gửi kèm làm gợi ý; PO sửa message trong lúc chờ thì giữ bản của PO.
const gitGen = new Set();   // gitKey đang chờ Claude viết
function gkGenButton() {
  const busy = gitGen.has(gitKey);
  return `<button class="gen ${busy ? 'busy' : ''}" id="gkGen" data-gen title="Write the summary and description from the staged diff with Claude — what you typed is used as a hint">${ic('sparkles')}${busy ? 'Writing…' : 'Generate'}</button>`;
}
async function gkGenerate() {
  const key = gitKey, sel = gitSel;
  if (!sel || gitGen.has(key)) return;
  const m = (gitMsgs[key] ||= { summary: '', desc: '' });
  const before = m.summary + '\0' + m.desc;
  gitGen.add(key);
  gkRenderRight();
  try {
    const r = await api('/api/git/suggest-message', { repo: sel.repo, wt: sel.wt || '', summary: m.summary, desc: m.desc });
    if (m.summary + '\0' + m.desc !== before) return toast('You edited the message while Claude was writing — kept yours.');
    m.summary = r.summary;
    m.desc = r.description;
    if (r.cut) toast('The diff was long — Claude only read the first part.');
  } catch (e) {
    toast(e.message);
  } finally {
    gitGen.delete(key);
    if (gitKey === key) gkRenderRight();
  }
}
function gkCommit() {
  if ($('gkCommit')?.disabled) return;
  const m = gitMsgs[gitKey] || {};
  gitAct('commit', { summary: (m.summary || '').trim(), description: (m.desc || '').trim() });
}

// ── Diff ──
function gkOpenDiff(o) { gitDiffOpen = o; gkRenderDiff(); gkRenderRight(); gkLoadDiff(); }
function gkCloseDiff() { gitDiffOpen = null; gkRenderDiff(); gkRenderRight(); }

// Sau stage/bỏ stage hay đọc lại trạng thái: diff đang mở đi theo tệp sang danh sách kia.
function gkSyncDiff() {
  const o = gitDiffOpen, f = gitD?.status.files.find((x) => x.path === o.path);
  if (!f) return gkCloseDiff();
  if (f.xy !== '??' && f.xy !== 'UU') {
    if (o.staged && f.xy[0] === '.') o.staged = false;
    else if (!o.staged && f.xy[1] === '.') o.staged = true;
  }
  gkRenderRight();
  gkLoadDiff();
}

async function gkLoadDiff(quiet = false) {
  const o = gitDiffOpen;
  if (!o) return;
  const q = new URLSearchParams({ repo: gitSel.repo, wt: gitSel.wt || '', path: o.path });
  if (o.sha) q.set('sha', o.sha);
  else if (o.staged) q.set('staged', '1');
  try {
    const r = await api('/api/git/diff?' + q);
    if (gitDiffOpen !== o) return;
    if (quiet && o.data && o.data.text === r.text && o.data.secret === r.secret) return;
    if (o.data && o.data.text !== r.text) o.webVer = (o.webVer || 0) + 1;   // tệp đổi → trang web tải lại
    o.data = r; o.err = null;
  } catch (e) {
    if (gitDiffOpen !== o || quiet) return;
    o.err = e.message;
  }
  gkRenderDiff();
}

function gkDiffHtml(text) {
  const out = [];
  let o = 0, n = 0, inHunk = false;
  const line = (cls, a, b, t) => `<div class="dl ${cls}"><span class="n">${a}</span><span class="n">${b}</span><span class="t">${esc(t)}</span></div>`;
  for (const ln of text.split('\n')) {
    if (ln.startsWith('diff --git ')) { inHunk = false; continue; }
    const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(ln);
    if (m) { o = +m[1]; n = +m[2]; inHunk = true; out.push(line('hunk', '', '', ln)); continue; }
    if (!inHunk) {
      if (ln && !/^(index |--- |\+\+\+ )/.test(ln)) out.push(line('meta', '', '', ln));   // tệp mới, đổi tên, nhị phân…
      continue;
    }
    if (ln[0] === '+') out.push(line('add', '', n++, ln.slice(1)));
    else if (ln[0] === '-') out.push(line('del', o++, '', ln.slice(1)));
    else if (ln[0] === ' ') out.push(line('', o++, n++, ln.slice(1)));
    else if (ln[0] === '\\') out.push(line('meta', '', '', ln));
  }
  return out.join('');
}

// Tệp .html xem được dạng trang web, đúng phiên bản đang mở: commit, index (staged) hay đĩa.
function gkWebUrl(o) {
  if (!/\.html?$/i.test(o.path) || o.st === 'D' || o.data?.secret) return null;
  const rev = o.sha || (o.staged ? 'index' : 'work');
  return `/git-view/${encodeURIComponent(gitSel.repo)}/${encodeURIComponent(gitSel.wt || '~')}/${rev}/${o.path.split('/').map(encodeURIComponent).join('/')}`;
}

function gkRenderDiff() {
  const el = $('gkDiff'), o = gitDiffOpen;
  el.hidden = !o;
  if (!o) { el.innerHTML = ''; delete el.dataset.web; return; }
  const prev = el.querySelector('.gk-diff-b'), top = prev && el.dataset.path === o.path ? prev.scrollTop : 0;
  const r = o.data, from = r?.from;
  const f = !o.sha && gitD?.status.files.find((x) => x.path === o.path);
  const lock = gitBusy || gitD?.readOnly ? 'disabled' : '';
  const act = !f ? '' : o.staged ? `<button data-dact="unstage" ${lock}>Unstage</button>`
    : (f.xy === 'UU' || (f.xy === '??' && f.secret) ? '' : `<button class="danger" data-dact="discard" ${lock} title="Throw away the unstaged changes in this file">Discard</button>`)
      + `<button class="primary" data-dact="stage" ${lock}>${f.xy === 'UU' ? 'Mark resolved' : 'Stage file'}</button>`;
  let body;
  if (o.err) body = `<div class="msg">${esc(o.err)}</div>`;
  else if (!r) body = '<div class="msg">Loading…</div>';
  else if (r.secret) body = '<div class="msg secret">Secret file (.env, key, certificate…) — contents are not shown here. Open it in your editor if you need to.</div>';
  else if (!r.text.trim()) body = '<div class="msg">No content changes (possibly a file mode change only).</div>';
  else body = gkDiffHtml(r.text) + (r.cut ? '<div class="gk-diff-cut">Diff too large — showing the first 400 KB. Open it in your editor to see the rest.</div>' : '');
  const web = gkWebUrl(o), asWeb = web && gitUi.htmlView !== 'diff';
  const head = `${ic('file')}<span class="t" title="${esc(o.path)}">${from ? esc(from) + ' → ' : ''}${esc(o.path)}</span>
      <span class="sub">${o.sha ? 'commit ' + o.sha.slice(0, 7) : o.staged ? 'staged' : 'unstaged'}</span>
      ${web ? `<div class="seg sm"><button data-dview="web" class="${asWeb ? 'active' : ''}" title="Render the file as a web page">Web</button><button data-dview="diff" class="${asWeb ? '' : 'active'}">Diff</button></div>
      <button class="link" data-dact="openweb" title="Open the page in a new browser tab">${ic('ext')}</button>` : ''}${act}
      <button class="link" data-dact="close" title="Close (Esc)">${ic('x')}</button>`;
  // Trang web giữ nguyên khung khi chỉ đổi phần đầu (trạng thái stage, nút bận): dựng lại iframe là trang tải lại từ đầu.
  // Nội dung tệp đổi (o.webVer tăng ở gkLoadDiff) thì mới tải lại.
  const webKey = asWeb ? `${web}|${o.webVer || 0}` : '';
  el.dataset.path = o.path;
  if (webKey && el.dataset.web === webKey) { el.querySelector('.gk-diff-h').innerHTML = head; return; }
  el.dataset.web = webKey;
  el.innerHTML = `<div class="gk-diff-h">${head}</div>` + (asWeb
    ? `<div class="gk-diff-b web"><iframe class="gk-web" src="${esc(web)}" title="${esc(o.path)}"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads"></iframe></div>`
    : `<div class="gk-diff-b">${body}</div>`);
  if (!asWeb) el.querySelector('.gk-diff-b').scrollTop = top;
}

function gkRenderAll() { gkRenderBar(); gkRenderSide(); gkRenderGraph(); gkRenderRight(); gkRenderDiff(); }

// ── Chế độ Files: cây tệp kiểu VS Code + lịch sử từng tệp ──
// Nút Graph | Files ở góc phải thanh Command history (gitUi.mode). Cây lấy từ /api/git/files (tệp git
// theo dõi + tệp mới chưa bị .gitignore); giữa là tab tệp trên đĩa hoặc diff của tệp trong một commit;
// phải là các commit chạm vào tệp đang mở, theo cả tên cũ khi đổi tên. Chỉ đọc, không sửa tệp.
const GIT_EX = 'gitmenorah-git-ex';
const EX = { key: '', seq: 0, files: null, xy: {}, cut: false, err: '', tree: null, dirMk: new Map(), open: new Set(), tabs: [], active: '', log: null, logFor: '', logBusy: false };
const exQ = () => new URLSearchParams({ repo: gitSel.repo, wt: gitSel.wt || '' });
const exName = (p) => p.slice(p.lastIndexOf('/') + 1);
const exDir = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');
const exCmp = (a, b) => a.localeCompare(b, 'en', { numeric: true, sensitivity: 'base' });
// Chữ cái như VS Code: M sửa, U mới (chưa theo dõi), A đã thêm, D đã xoá, R đổi tên, C xung đột.
const exMark = (xy) => !xy ? '' : xy === '??' ? 'U' : xy === 'UU' || xy.includes('U') ? 'C' : xy.includes('D') ? 'D' : xy.includes('A') ? 'A' : xy.includes('R') ? 'R' : 'M';
const exRoot = () => gitD ? normPath(gitSel.wt ? join2(gitD.mainPath, gitSel.wt) : gitD.mainPath) : '';
const exActive = () => EX.tabs.find((t) => t.id === EX.active) || null;
const exFileOf = (t) => t && (t.kind === 'file' ? t.path : t.file);

function gkModeSw() {
  return `<div class="seg sm gk-mode">${[['graph', 'Graph', 'Commit graph of the repository'], ['files', 'Files', 'Project structure and file history']].map(([k, l, tt]) =>
    `<button data-mode="${k}" class="${gitUi.mode === k ? 'active' : ''}" title="${tt}">${ic(k)}${l}</button>`).join('')}</div>`;
}
function gkSetMode(m) {
  gitUi.mode = m === 'files' ? 'files' : 'graph';
  gitSaveUi();
  if (gitView === 'projects') gkSetView('repo');
  gkApplyMode();
  gitRenderHistory();
}
function gkApplyMode() {
  $('panelGit').classList.toggle('files', gitUi.mode === 'files');
  if (gitUi.mode === 'files') exLoad();
}

// Thư mục đang mở và tab đang mở nhớ theo repo|worktree.
function exSave() {
  const all = gkStored(GIT_EX, {});
  delete all[EX.key];
  all[EX.key] = { open: [...EX.open].slice(0, 300), tabs: EX.tabs.filter((t) => t.kind === 'file' && !t.preview).map((t) => t.path).slice(0, 20), active: exFileOf(exActive()) || '' };
  const keys = Object.keys(all);
  for (const k of keys.slice(0, Math.max(0, keys.length - 30))) delete all[k];
  localStorage.setItem(GIT_EX, JSON.stringify(all));
}

async function exLoad() {
  if (gitUi.mode !== 'files' || gitView !== 'repo') return;
  if (!gitSel) { EX.key = ''; EX.files = null; EX.err = 'Pick a repository first.'; return exRenderAll(); }
  const key = `${gitSel.repo}|${gitSel.wt || ''}`;
  if (key !== EX.key) {
    EX.key = key; EX.files = null; EX.tree = null; EX.err = ''; EX.xy = {}; EX.log = null; EX.logFor = '';
    const st = gkStored(GIT_EX, {})[key] || {};
    EX.open = new Set(st.open || []);
    EX.tabs = (st.tabs || []).map((p) => ({ id: 'f:' + p, kind: 'file', path: p }));
    if (st.active && !EX.tabs.some((t) => t.path === st.active)) EX.tabs.push({ id: 'f:' + st.active, kind: 'file', path: st.active, preview: true });
    EX.active = st.active ? 'f:' + st.active : '';
    $('exFilter').value = '';
    exRenderAll();
  }
  const seq = ++EX.seq;
  let r;
  try { r = await api('/api/git/files?' + exQ()); } catch (e) {
    if (seq !== EX.seq || key !== EX.key) return;
    EX.err = e.message; return exRenderSide();
  }
  if (seq !== EX.seq || key !== EX.key) return;
  const sig = JSON.stringify(r.xy), first = !EX.files, changed = !first && sig !== EX.sig;
  EX.err = ''; EX.cut = r.cut; EX.xy = r.xy; EX.sig = sig;
  if (first || changed || r.files.length !== EX.files.length) { EX.files = r.files; EX.tree = exBuild(r.files); }
  exMarkDirs();
  exRenderSide();
  const t = exActive();
  if (first) { if (t) exShow(t); else exRenderMain(); exLoadLog(); }
  else if (changed) {
    // Trạng thái đổi (vừa lưu tệp, commit, đổi nhánh): đọc lại tệp đang xem và lịch sử của nó.
    for (const x of EX.tabs) if (x.kind === 'file' || x.kind === 'work') { x.data = null; x.err = null; }
    if (t) exLoadTab(t, true);
    exLoadLog(true);
  }
}

function exBuild(files) {
  const root = { path: '', dirs: new Map(), files: [] };
  for (const p of files) {
    const parts = p.split('/');
    let n = root;
    for (let i = 0; i < parts.length - 1; i++) {
      let c = n.dirs.get(parts[i]);
      if (!c) { c = { path: parts.slice(0, i + 1).join('/'), dirs: new Map(), files: [] }; n.dirs.set(parts[i], c); }
      n = c;
    }
    n.files.push(p);
  }
  return root;
}
// Thư mục có tệp đổi bên trong được chấm màu; xung đột thắng, rồi tới sửa, cuối cùng là tệp mới.
function exMarkDirs() {
  const rank = { C: 4, D: 3, M: 2, R: 1, A: 1, U: 1 };
  EX.dirMk = new Map();
  for (const [p, xy] of Object.entries(EX.xy)) {
    const m = exMark(xy);
    for (let d = exDir(p); d; d = exDir(d)) {
      const cur = EX.dirMk.get(d);
      if (!cur || rank[m] > rank[cur]) EX.dirMk.set(d, m);
    }
  }
}

function exRenderAll() { exRenderSide(); exRenderMain(); exRenderLog(); }

function exRenderSide() {
  const r = gitList.find((x) => x.id === gitSel?.repo);
  $('exTitle').textContent = r ? `${r.label}${gitSel.wt ? ' · ' + wtShort(gitSel.wt) : ''}` : 'Explorer';
  $('exTitle').title = exRoot();
  $('exTerm').hidden = !MN.on;
  const el = $('exTree'), top = el.scrollTop;
  if (EX.err) { el.innerHTML = `<div class="ex-note">${esc(EX.err)}</div>`; return; }
  if (!EX.tree) { el.innerHTML = '<div class="ex-note">Loading files…</div>'; return; }
  const q = $('exFilter').value.trim().toLowerCase();
  const cur = exFileOf(exActive());
  const pad = (d) => `style="padding-left:${10 + d * 14}px"`;
  const fileRow = (p, d, withDir) => {
    const m = exMark(EX.xy[p]);
    return `<div class="ex-it${m ? ' ex-' + m : ''}${p === cur ? ' on' : ''}" data-file="${esc(p)}" ${pad(d)} title="${esc(p)}">
      <span style="width:12px;flex:none"></span>${ic('file')}<span class="nm">${esc(exName(p))}</span>${withDir && exDir(p) ? `<span class="dir">${esc(exDir(p))}</span>` : ''}${m ? `<span class="mk">${m}</span>` : ''}</div>`;
  };
  const out = [];
  if (q) {
    // Gõ để nhảy tới tệp: mọi từ phải có trong đường dẫn; khớp tên tệp xếp trước.
    const words = q.split(/\s+/);
    const hit = EX.files.filter((p) => { const l = p.toLowerCase(); return words.every((w) => l.includes(w)); });
    const inName = (p) => words.every((w) => exName(p).toLowerCase().includes(w));
    hit.sort((a, b) => inName(b) - inName(a) || a.length - b.length || exCmp(a, b));
    for (const p of hit.slice(0, 200)) out.push(fileRow(p, 0, true));
    if (!hit.length) out.push('<div class="ex-note">No matching files.</div>');
    else if (hit.length > 200) out.push(`<div class="ex-note">Showing 200 of ${hit.length} — type more to narrow down.</div>`);
  } else {
    const walk = (n, d) => {
      for (const [name, c] of [...n.dirs.entries()].sort((a, b) => exCmp(a[0], b[0]))) {
        const open = EX.open.has(c.path), m = EX.dirMk.get(c.path);
        out.push(`<div class="ex-it${m ? ' ex-' + m : ''}" data-dir="${esc(c.path)}" ${pad(d)}>${ic('down', 'gk-tw' + (open ? '' : ' shut'))}${ic('folder')}<span class="nm">${esc(name)}</span>${m ? '<span class="dot"></span>' : ''}</div>`);
        if (open) walk(c, d + 1);
      }
      for (const p of [...n.files].sort((a, b) => exCmp(exName(a), exName(b)))) out.push(fileRow(p, d));
    };
    walk(EX.tree, 0);
    if (!EX.files.length) out.push('<div class="ex-note">This repository has no files yet.</div>');
    if (EX.cut) out.push('<div class="ex-note">Large repository — only the first 30,000 files are listed. Use the search box above.</div>');
  }
  el.innerHTML = out.join('');
  el.scrollTop = top;
}

// Mở tệp. Bấm một lần mở tab xem tạm (chữ nghiêng, tệp sau thay chỗ nó); bấm đúp thì giữ tab lại.
function exOpen(t, pin) {
  let cur = EX.tabs.find((x) => x.id === t.id);
  if (!cur) {
    cur = { ...t, preview: !pin };
    const pv = EX.tabs.findIndex((x) => x.preview);
    if (pv >= 0) EX.tabs.splice(pv, 1, cur);
    else EX.tabs.splice(EX.tabs.findIndex((x) => x.id === EX.active) + 1, 0, cur);
  } else if (pin) cur.preview = false;
  const f = exFileOf(cur);
  for (let d = exDir(f); d; d = exDir(d)) EX.open.add(d);
  exShow(cur);
  exSave();
}
function exShow(t) {
  const prev = exActive();
  if (prev && prev !== t) prev.top = $('exView').scrollTop;
  EX.active = t.id;
  exRenderSide(); exRenderMain();
  exLoadTab(t);
  if (exFileOf(t) !== EX.logFor) exLoadLog(); else exRenderLog();
  $('exTree').querySelector('.ex-it.on')?.scrollIntoView({ block: 'nearest' });
}
function exClose(id) {
  const i = EX.tabs.findIndex((x) => x.id === id);
  if (i < 0) return;
  EX.tabs.splice(i, 1);
  if (EX.active === id) {
    const nx = EX.tabs[Math.min(i, EX.tabs.length - 1)];
    if (nx) return exShow(nx), exSave();
    EX.active = '';
    exRenderSide(); exRenderMain(); exLoadLog();
  } else exRenderMain();
  exSave();
}

async function exLoadTab(t, quiet) {
  if (t.data || t.busy) return;
  t.busy = true;
  const q = exQ();
  q.set('path', t.path);
  if (t.kind === 'diff') q.set('sha', t.sha);
  if (t.kind === 'work') q.set('staged', t.staged ? '1' : '0');
  try { t.data = await api((t.kind === 'file' ? '/api/git/file?' : '/api/git/diff?') + q); t.err = null; } catch (e) { if (!quiet) t.err = e.message; }
  t.busy = false;
  if (EX.tabs.includes(t) && t.id === EX.active) exRenderMain(quiet);
}

// Tô màu cú pháp gọn: chú thích, chuỗi, số, từ khoá, thẻ HTML. Không phân tích ngữ pháp — đủ để đọc.
const EX_KW = new Set(('abstract as async await break case catch class const continue debugger def default defer del delete do elif else enum except export extends ' +
  'false final finally fn for from func function go if impl implements import in instanceof interface is lambda let match mod module mut namespace new nil None not null ' +
  'of or package pass private protected pub public raise readonly return self static struct super switch then this throw throws true True False try type typeof undefined use var void when where while with yield fi esac done local echo').split(' '));
const EX_STR = `"(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*'`;
const EX_NUM = '\\b(?:0x[\\da-fA-F]+|\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b';
const EX_LANGS = {
  c: new RegExp(`(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|(${EX_STR}|\`(?:[^\`\\\\]|\\\\[\\s\\S])*\`)|(${EX_NUM})|\\b([A-Za-z_$][\\w$]*)\\b`, 'g'),
  hash: new RegExp(`((?<![\\w$\\{'"])#[^\\n]*)|(${EX_STR})|(${EX_NUM})|\\b([A-Za-z_][\\w]*)\\b`, 'g'),
  sql: new RegExp(`(--[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|(${EX_STR})|(${EX_NUM})|\\b([A-Za-z_][\\w]*)\\b`, 'g'),
  xml: /(<!--[\s\S]*?-->)|("[^"\n]*"|'[^'\n]*')|()(<\/?[\w:.-]+|\/?>)/g,
  md: /(^#{1,6} [^\n]*)|(`[^`\n]+`|^```[^\n]*)/gm,
};
const EX_EXT = {};
for (const [l, xs] of Object.entries({
  c: 'js mjs cjs jsx ts tsx mts cts java c h cpp cc hpp cs go rs swift kt kts scala dart php css scss less json jsonc json5 gradle groovy proto prisma',
  hash: 'sh bash zsh py rb yml yaml toml ini conf cfg properties dockerfile makefile mk r pl gitignore dockerignore editorconfig example env',
  sql: 'sql', xml: 'html htm xml svg vue xaml plist xsd', md: 'md markdown',
})) for (const x of xs.split(' ')) EX_EXT[x] = l;
const EX_SQL_KW = new Set('select from where and or not null is in join left right inner outer on as group by order having limit offset insert into values update set delete create table alter add drop index primary key foreign references default unique constraint begin commit rollback case when then else end returning union all distinct exists cascade if view function returns language trigger with'.split(' '));
function exHl(text, path) {
  const n = exName(path).toLowerCase(), lang = EX_EXT[n.includes('.') ? n.slice(n.lastIndexOf('.') + 1) : n];
  if (!lang || text.length > 400 * 1024) return esc(text);
  const re = EX_LANGS[lang];
  re.lastIndex = 0;
  let out = '', i = 0, m;
  while ((m = re.exec(text))) {
    if (!m[0]) { re.lastIndex++; continue; }
    const cls = m[1] !== undefined && m[1] !== '' ? (lang === 'md' ? 'k' : 'c') : m[2] ? 's' : m[3] ? 'n'
      : m[4] ? (lang === 'xml' ? 't' : (lang === 'sql' ? EX_SQL_KW.has(m[4].toLowerCase()) : EX_KW.has(m[4])) ? 'k' : '') : '';
    out += esc(text.slice(i, m.index)) + (cls ? `<span class="hl-${cls}">${esc(m[0])}</span>` : esc(m[0]));
    i = m.index + m[0].length;
  }
  return out + esc(text.slice(i));
}

// Xem trước Markdown (README, docs) ở chế độ Files: tiêu đề, đoạn, danh sách lồng nhau (có
// ô task), trích dẫn, bảng, khối code tô màu, liên kết, ảnh, video GitHub. HTML thô trong tệp hiện
// nguyên văn — mọi chữ đều qua esc() trước, liên kết chỉ nhận http(s)/mailto/#/đường dẫn tương đối.
const EX_MD = /\.(md|markdown|mdx)$/i;
const EX_MD_VIDEO = /^https:\/\/(github\.com\/user-attachments\/assets\/[\w-]+|user-images\.githubusercontent\.com\/[\w/.-]+\.(mp4|mov|webm))$/i;
function exMdHtml(src, path) {
  const base = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
  // Đường dẫn trong repo (tương đối theo tệp, hay /từ gốc repo) → đường dẫn chuẩn, hoặc null nếu ra ngoài repo.
  const inRepo = (u) => {
    const parts = [];
    for (const x of (u.startsWith('/') ? u.slice(1) : base + u).split('/')) {
      if (x === '..') { if (!parts.length) return null; parts.pop(); } else if (x && x !== '.') parts.push(x);
    }
    return parts.join('/');
  };
  const unesc = (u) => u.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>');
  const slug = (t) => t.toLowerCase().replace(/<[^>]+>/g, '').replace(/&[a-z#0-9]+;/g, '').replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s/g, '-');
  const link = (href, inner) => {
    const u = unesc(href);
    if (u.startsWith('#')) return `<a href="#" data-mdanchor="${esc(u.slice(1).toLowerCase())}">${inner}</a>`;
    if (/^(https?:|mailto:)/i.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    if (/^[a-z][a-z\d+.-]*:/i.test(u) || u.startsWith('//')) return inner;   // javascript:, data:, file:…
    const p = inRepo(u.replace(/[?#].*$/, ''));
    return p ? `<a href="#" data-mdopen="${esc(p)}" title="${esc(p)}">${inner}</a>` : inner;
  };
  const img = (alt, href) => {
    const u = unesc(href);
    let s = null;
    if (/^https?:/i.test(u)) s = u;
    else if (!/^[a-z][a-z\d+.-]*:/i.test(u) && !u.startsWith('//')) { const p = inRepo(u.replace(/[?#].*$/, '')); if (p) s = exViewUrl(p); }
    return s ? `<img src="${esc(s)}" alt="${alt}" loading="lazy">` : alt;
  };
  // Chữ trong một dòng. Code dòng và liên kết giữ chỗ trước để đậm/nghiêng không chạm vào chúng.
  const inline = (raw) => {
    const keep = [], put = (h) => `\u0000${keep.push(h) - 1}\u0000`;
    let t = raw.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, b, c) => put(`<code>${esc(c.trim() || c)}</code>`));
    t = esc(t)
      .replace(/!\[([^\]]*)\]\(\s*((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^]*?&quot;)?\s*\)/g, (_, a, u) => put(img(a, u)))
      .replace(/\[([^\]]+)\]\(\s*((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^]*?&quot;)?\s*\)/g, (_, x, u) => put(link(u, x)))
      .replace(/&lt;((?:https?:\/\/|mailto:)[^\s&]+(?:&amp;[^\s&]+)*)&gt;/g, (_, u) => put(link(u, u)))
      .replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,:;!?)'"])/g, (_, a, u) => a + put(link(u, u)));
    t = t.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>').replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<b>$2</b>')
      .replace(/(^|[^*\w])\*(?=[^\s*])([^*]*?[^\s*])\*(?!\*)/g, '$1<i>$2</i>').replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<i>$2</i>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<s>$1</s>')
      .replace(/( {2,}|\\)\n/g, '<br>');
    // Ảnh nằm trong liên kết ([![badge](…)](…)) là chỗ giữ lồng nhau — trả lại đến hết.
    while (/\u0000\d+\u0000/.test(t)) t = t.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
    return t;
  };
  const LIST = /^( *)([-*+]|\d{1,9}[.)])( +|$)/;
  const isBreak = (l, nx) => /^ {0,3}(#{1,6}( |$)|>|```|~~~)/.test(l) || /^ {0,3}([-*_])( *\1){2,} *$/.test(l) || LIST.test(l) || /^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:|-]+\|?\s*$/.test(nx || '');
  const cells = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
  const blocks = (lines) => {
    const out = [];
    for (let i = 0; i < lines.length;) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      const fence = l.match(/^ {0,3}(```+|~~~+)\s*([\w+#.-]*)/);
      if (fence) {
        const code = [];
        for (i++; i < lines.length && !lines[i].trimStart().startsWith(fence[1]); i++) code.push(lines[i]);
        i++;
        out.push(`<pre><code>${exHl(code.join('\n'), 'x.' + (fence[2] || 'txt').toLowerCase())}</code></pre>`);
        continue;
      }
      const hd = l.match(/^ {0,3}(#{1,6})(?: +(.*?))?(?: +#+)? *$/);
      if (hd) { const x = inline(hd[2] || ''); out.push(`<h${hd[1].length} data-anchor="${esc(slug(x))}">${x}</h${hd[1].length}>`); i++; continue; }
      if (/^ {0,3}([-*_])( *\1){2,} *$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^ {0,3}>/.test(l)) {
        const q = [];
        while (i < lines.length && lines[i].trim() && (/^ {0,3}>/.test(lines[i]) || !isBreak(lines[i]))) q.push(lines[i++].replace(/^ {0,3}> ?/, ''));
        out.push(`<blockquote>${blocks(q)}</blockquote>`);
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1] || '') && lines[i + 1].includes('-')) {
        const al = cells(lines[i + 1]).map((c) => (c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right') : c.startsWith(':') ? 'left' : ''));
        const row = (r, tg) => `<tr>${cells(r).map((c, k) => `<${tg}${al[k] ? ` style="text-align:${al[k]}"` : ''}>${inline(c)}</${tg}>`).join('')}</tr>`;
        let t = `<thead>${row(l, 'th')}</thead><tbody>`;
        for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) t += row(lines[i], 'td');
        out.push(`<div class="tbl"><table>${t}</tbody></table></div>`);
        continue;
      }
      const li = l.match(LIST);
      if (li) {
        // Một danh sách = các mục cùng lề; dòng thụt sâu hơn (kể cả sau dòng trống) thuộc mục trước.
        const ind = li[1].length, ordered = /\d/.test(li[2]), items = [];
        let loose = false;
        while (i < lines.length) {
          const m = lines[i].match(LIST);
          if (!m || m[1].length !== ind || /\d/.test(m[2]) !== ordered) break;
          const w = ind + m[2].length + Math.min(m[3].length || 1, 4), body = [lines[i].slice(w)];
          for (i++; i < lines.length; i++) {
            const x = lines[i];
            if (!x.trim()) {
              const nx = lines.slice(i + 1).find((y) => y.trim());
              if (!nx || nx.length - nx.trimStart().length < w && !(nx.match(LIST)?.[1].length === ind)) break;
              if (nx.match(LIST)?.[1].length === ind) { loose = true; break; }
              body.push(''); continue;
            }
            const xi = x.length - x.trimStart().length;
            if (xi >= w) body.push(x.slice(w));
            else if (xi > ind && LIST.test(x)) body.push(x.slice(Math.min(xi, w)));
            else if (!isBreak(x) && body[body.length - 1] !== '') body.push(x.trim());
            else break;
          }
          while (i < lines.length && !lines[i].trim()) i++;
          items.push({ body, n: parseInt(m[2], 10) });
        }
        const html = items.map(({ body }) => {
          let h = blocks(body), task = false;
          if (!loose) h = h.replace(/^<p>([\s\S]*?)<\/p>/, '$1');
          h = h.replace(/^(<p>)?\[([ xX])\] /, (_, p, c) => { task = true; return `${p || ''}<input type="checkbox" disabled${c !== ' ' ? ' checked' : ''}> `; });
          return `<li${task ? ' class="task"' : ''}>${h}</li>`;
        }).join('');
        out.push(ordered ? `<ol${items[0].n !== 1 ? ` start="${items[0].n}"` : ''}>${html}</ol>` : `<ul>${html}</ul>`);
        continue;
      }
      if (/^( {4}|\t)/.test(l)) {
        const code = [];
        while (i < lines.length && (/^( {4}|\t)/.test(lines[i]) || !lines[i].trim())) code.push(lines[i++].replace(/^( {4}|\t)/, ''));
        while (code.length && !code[code.length - 1].trim()) code.pop();
        out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
        continue;
      }
      const p = [l.replace(/^\s+/, '')];
      for (i++; i < lines.length && lines[i].trim() && !isBreak(lines[i], lines[i + 1]); i++) {
        // Tiêu đề kiểu gạch dưới (Setext): dòng === hay --- ngay dưới đoạn.
        if (/^ {0,3}(=+|-+) *$/.test(lines[i])) break;
        p.push(lines[i].replace(/^\s+/, ''));
      }
      const st = lines[i]?.match(/^ {0,3}(=+|-+) *$/);
      if (st) { const x = inline(p.join('\n')), n = st[1][0] === '=' ? 1 : 2; out.push(`<h${n} data-anchor="${esc(slug(x))}">${x}</h${n}>`); i++; continue; }
      // Link video GitHub đứng riêng một đoạn → trình phát ngay trong trang, như GitHub.
      if (p.length === 1 && EX_MD_VIDEO.test(p[0].trim())) { out.push(`<video src="${esc(p[0].trim())}" controls preload="metadata"></video>`); continue; }
      out.push(`<p>${inline(p.join('\n'))}</p>`);
    }
    return out.join('');
  };
  // Bỏ front matter YAML (---…---) ở đầu tệp, như GitHub.
  const text = src.replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '').replace(/^---\n[\s\S]*?\n---\n/, '').replace(/\t/g, '    ');
  return blocks(text.split('\n'));
}

const exKb = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

// ── Lịch sử tệp (cột phải) ──
async function exLoadLog(quiet) {
  const f = exFileOf(exActive()) || '';
  EX.logFor = f;
  if (!f) { EX.log = null; return exRenderLog(); }
  if (!quiet) { EX.log = null; exRenderLog(); }
  const q = exQ(); q.set('path', f); q.set('n', EX.logN || 100);
  let r;
  try { r = await api('/api/git/file-log?' + q); } catch (e) { r = { commits: [], more: false, error: e.message }; }
  if (EX.logFor !== f) return;
  EX.log = r;
  exRenderLog();
}
function exRenderLog() {
  const el = $('exLog'), f = EX.logFor, t = exActive();
  const head = `<div class="ex-h"><b title="${esc(f)}">History${f ? ' · ' + esc(exName(f)) : ''}</b>${f ? `<button data-ex="logreload" title="Reload">${ic('reload')}</button>` : ''}</div>`;
  if (!f) { el.innerHTML = head + '<div class="ex-note">Open a file to see the commits that changed it.</div>'; return; }
  const xy = EX.xy[f], m = exMark(xy), out = [];
  if (m) {
    const staged = xy !== '??' && xy[1] === '.';
    out.push(`<button class="ex-c${t?.kind === 'work' ? ' on' : ''}" data-work="1" data-staged="${staged ? 1 : 0}">
      <span class="s"><span class="st ex-${m}">${m}</span>${xy === '??' ? 'New file — not committed yet' : staged ? 'Staged changes' : 'Uncommitted changes'}</span>
      <span class="m"><span class="a">Working tree</span></span></button>`);
  }
  const r = EX.log;
  if (!r) out.push('<div class="ex-note">Loading history…</div>');
  else {
    if (r.error) out.push(`<div class="ex-note">${esc(r.error)}</div>`);
    for (const c of r.commits) out.push(`<button class="ex-c${t?.kind === 'diff' && t.sha === c.h ? ' on' : ''}" data-c="${esc(c.h)}" title="${esc(`${c.s}\n${c.a} · ${gkFull(c.t)}\n${c.h}`)}">
      <span class="s"><span class="st ex-${c.st === 'A' ? 'A' : c.st === 'D' ? 'D' : c.st === 'R' ? 'R' : 'M'}">${esc(c.st)}</span>${esc(c.s)}</span>
      ${c.from ? `<span class="rn">renamed from ${esc(c.from)}</span>` : ''}
      <span class="m"><span class="a">${esc(c.a)}</span><span>${gkWhen(c.t)}</span><code>${c.h.slice(0, 7)}</code></span></button>`);
    if (!r.error && !r.commits.length && !m) out.push('<div class="ex-note">No commits touch this file yet.</div>');
    if (r.more) out.push('<button class="ex-c" data-more="1" style="text-align:center;color:var(--accent)">Show more</button>');
  }
  const prev = el.querySelector('.ex-loglist')?.scrollTop || 0;
  el.innerHTML = head + `<div class="ex-loglist">${out.join('')}</div>`;
  el.querySelector('.ex-loglist').scrollTop = prev;
}

  const ml = e.target.closest('[data-mdopen],[data-mdanchor]');

    const p = ml.dataset.mdopen;

    if (k === 'web' && t) return window.open(exViewUrl(t.path), '_blank');

    return;

  const close = e.target.closest('[data-close]');
  if (close) { e.stopPropagation(); return exClose(close.dataset.close); }
  const tab = e.target.closest('[data-tab]');
  if (tab) { const t = EX.tabs.find((x) => x.id === tab.dataset.tab); return t && t.id !== EX.active && exShow(t); }
  const d = e.target.closest('[data-dir]');

    if (x) exOpen({ id: `d:${x.h}:${x.path}`, kind: 'diff', sha: x.h, path: x.path, file: EX.logFor, subject: x.s, author: x.a, when: x.t }, e.detail > 1);

});

// ── Hộp thoại dùng chung ──
function gitDialog({ title, html, ok = 'Run', okClass = 'primary', cancel = 'Cancel', hideOk = false, focus, mount, beforeOk }) {
  return new Promise((done) => {
    const dlg = $('gitDlg'), okB = $('dlgOk'), cB = $('dlgCancel');
    $('dlgTitle').textContent = title;
    $('dlgContent').innerHTML = html;
    okB.hidden = hideOk; okB.className = okClass; okB.textContent = ok; okB.disabled = false;
    cB.textContent = cancel;
    let settled = false;
    const finish = (v) => { if (settled) return; settled = true; dlg.onclose = null; dlg.close(); done(v); };
    okB.onclick = async () => {
      if (!beforeOk) return finish(true);
      okB.disabled = true;
      const v = await beforeOk();
      okB.disabled = false;
      if (v !== false) finish(true);
    };
    cB.onclick = () => finish(false);
    dlg.onclose = () => finish(false);   // phím Esc
    dlg.showModal();
    mount?.($('dlgContent'), okB);
    ((focus && $('dlgContent').querySelector(focus)) || (hideOk ? cB : okB)).focus();
  });
}

// Lệnh chạy ở nhiều worktree (Commit & merge): chèn dòng "# <worktree>" mỗi khi đổi chỗ chạy.
function gkStepLines(steps, line) {
  let at = null;
  return steps.map((x) => (x.where && x.where !== at ? `<span class="at"># ${esc(at = x.where)}</span><br>` : '') + line(x)).join('<br>');
}

    <div class="dlg-cmds">${gkStepLines(p.steps, (x) => '$ ' + esc(x.cmd))}</div>
    ${p.warn.length ? `<ul class="dlg-warn">${p.warn.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    ${p.alt ? `<div class="dlg-alt"><span>${esc(p.alt.why)}</span><button type="button" id="dlgAlt">${esc(p.alt.label)}</button></div>` : ''}

  const OK = { abort: 'Abort', commit: 'Commit', checkout: 'Checkout', revert: 'Revert', stash: 'Stash', pop: 'Pop', push: 'Push', pull: 'Pull', merge: 'Merge', rebase: 'Rebase',

    cancel: plan.block ? 'Close' : 'Cancel', hideOk: !!plan.block,
    mount: (root, okB) => {

      // Có ô xác nhận (tệp bí mật…) thì nút chạy chỉ bật khi đã tick.
      const sync = () => { okB.disabled = busy || (!!cur.ack && !root.querySelector('#dlgAck')?.checked); };
      root.addEventListener('change', (e) => { if (e.target.id === 'dlgAck') sync(); });
      sync();
      // Pull đã rẽ nhánh: nút gợi ý lập lại kế hoạch với kiểu pull chạy được — chỉ cho lần này,
      // không đổi kiểu pull đã chọn ở thanh công cụ.
      root.addEventListener('click', async (e) => {
        if (e.target.id !== 'dlgAlt' || busy || !cur.alt) return;
        const mode = cur.alt.mode;
        busy = true; e.target.disabled = true; sync();
        let next = null;
        try { next = await api('/api/git/run', { ...body, mode, dryRun: true }); } catch (err) { toast(err.message); }
        busy = false;
        if (next) { cur = next; body.mode = mode; }
        $('dlgPlan').innerHTML = view(cur);
        $('dlgTitle').textContent = cur.block ? 'Cannot run' : cur.title;
        okB.hidden = !!cur.block;
        sync();
      });
      const box = root.querySelector('#dlgFF');
      if (!box) return;
      // Đổi lựa chọn → hỏi lại server. Chỉ nhận lựa chọn mới khi hộp đã hiện đúng lệnh mới;
      // trong lúc chờ khoá nút chạy để không chạy lệnh cũ với cờ mới.
      box.onchange = async () => {
        const want = box.checked;
        busy = true; box.disabled = true; sync();
        try {
          cur = await api('/api/git/run', { ...body, ff: want, dryRun: true });
          body.ff = want;
        } catch (e) { toast(e.message); box.checked = !!body.ff; }
        busy = false; box.disabled = false;
        $('dlgPlan').innerHTML = view(cur);
        $('dlgTitle').textContent = cur.block ? 'Cannot run' : cur.title;
        okB.hidden = !!cur.block;
        sync();
      };
    },
  });
  return ok && !cur.block ? cur : null;
}

// "Commit & merge into develop" ở menu chuột phải worktree: commit thay đổi còn lại (nếu có)
// rồi merge nhánh vào develop tại worktree đang giữ develop. Server soát luật và hiện lệnh
// ở hộp xác nhận như mọi thao tác ghi khác.
function gkShipItem(rel, br) {
  const shared = !br || br === 'detached' || /^(develop|main|master|staging|prod|production)$/.test(br);
  const dev = gitD.branches.local.find((b) => b.name === 'develop');
  return {
    label: 'Commit & merge into develop…', act: () => gkShipDialog(rel, br),
    disabled: gitBusy || !!gitD.readOnly || shared || !dev?.wtPath,
    sub: gitD.readOnly ? 'read-only repository' : shared ? 'feature branches only' : !dev?.wtPath ? 'develop is not checked out in any worktree' : '',
  };
}
async function gkShipDialog(rel, branch) {
  const repo = gitSel.repo, key = `${repo}|${rel}`;
  let d;
  try { d = await api('/api/git/detail?' + new URLSearchParams({ repo, wt: rel })); } catch (e) { return toast(e.message); }
  const s = d.status, dev = d.branches.local.find((b) => b.name === 'develop');
  if (!dev?.wtPath) return toast('develop is not checked out in any worktree');
  const devAt = dev.wtPath === d.mainPath ? 'the main worktree' : `worktree <code>${esc(wtShort(d.worktrees.find((w) => w.path === dev.wtPath)?.rel || dev.wtPath))}</code>`;
  // Chỉ mời fast-forward khi develop chỉ đi sau upstream; lệch hai phía thì server chặn, chỉ cảnh báo.
  const behind = /ahead/.test(dev.track || '') ? 0 : +(/behind (\d+)/.exec(dev.track || '')?.[1] || 0);
  const total = s.filesTotal ?? s.files.length, m = gitMsgs[key] || {};
  const f = { mode: s.staged ? 'staged' : 'all', summary: m.summary || '', desc: m.desc || '', ff: behind > 0 };
  const ok = await gitDialog({
    title: 'Commit & merge into develop', ok: 'Review commands', focus: total ? '#shSum' : null,
    html: `<div class="sub">Merges <code>${esc(branch)}</code> into <code>develop</code> in ${devAt}, always with <code>--no-ff</code>. Nothing is pushed.</div>
      <div class="gk-form">${total ? `
        <div class="row"><span class="lbl">Commit</span><div class="seg" id="shMode">${s.staged
          ? `<button data-mode="staged" class="${f.mode === 'staged' ? 'active' : ''}">Staged only · ${s.staged}</button>` : ''}<button data-mode="all" class="${f.mode === 'all' ? 'active' : ''}">All changes · ${total}</button></div></div>
        <div class="row"><input type="text" id="shSum" placeholder="Summary (required)" maxlength="200" autocomplete="off" spellcheck="false" value="${esc(f.summary)}" /></div>
        <div class="row"><textarea id="shDesc" rows="3" placeholder="Description (optional)">${esc(f.desc)}</textarea></div>`
        : `<div class="gd-empty" style="margin-top:10px">No uncommitted changes — merges the commits already on ${esc(branch)}.</div>`}
        ${behind ? `<label class="gd-check"><input type="checkbox" id="shFF" checked /><span>First fast-forward develop to <code>${esc(dev.upstream)}</code> (↓${behind}) so the merge lands on the latest develop</span></label>` : ''}
      </div>`,
    mount: (root) => {
      // Nháp dùng chung với ô Commit của worktree đó — gõ ở đâu cũng giữ.
      const save = () => { gitMsgs[key] = { summary: f.summary, desc: f.desc }; };
      root.querySelector('#shMode')?.addEventListener('click', (e) => {
        const b = e.target.closest('[data-mode]');
        if (!b) return;
        f.mode = b.dataset.mode;
        for (const x of root.querySelectorAll('[data-mode]')) x.classList.toggle('active', x === b);
      });
      const sum = root.querySelector('#shSum'), desc = root.querySelector('#shDesc'), ff = root.querySelector('#shFF');
      if (sum) sum.oninput = () => { f.summary = sum.value; save(); };
      if (desc) desc.oninput = () => { f.desc = desc.value; save(); };
      if (ff) ff.onchange = () => { f.ff = ff.checked; };
    },
    beforeOk: () => {
      if (!total || f.summary.trim()) return true;
      $('shSum').focus();
      toast('Enter a commit summary');
      return false;
    },
  });
  if (!ok) return;
  gitAct('ship', { wt: rel, mode: f.mode, summary: f.summary, description: f.desc, ffDevelop: f.ff });
}

// Gỡ worktree từ menu chuột phải, tuỳ chọn xoá luôn nhánh local. Server soát cây sạch,

async function gkBranchDialog({ base, sha, wtOnly }) {

      || ['origin/staging', 'staging', 'origin/develop', 'develop'].find((n) => names.includes(n)) || names[0] || '',
  };
  const opt = (list) => list.map((n) => `<option ${n === f.base ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const subj = sha && gitRows.find((r) => r.c.h === sha)?.c.s;
  const preview = () => {
    const slug = f.slug.trim() || '<short-name>';
    $('bdName').textContent = `${f.kind}/${stampNow()}_${slug}` + (f.worktree ? `  ·  .worktrees/${slug}` : '');
  };
  const ok = await gitDialog({
    title: wtOnly ? 'New worktree' : 'New branch', ok: 'Review commands', focus: '#bdSlug',
    html: `<div class="gk-form">
      <div class="row"><span class="lbl">Type</span><div class="seg" id="bdKind">
        <button data-kind="feat" class="${f.kind === 'feat' ? 'active' : ''}">feat</button><button data-kind="hotfix" class="${f.kind === 'hotfix' ? 'active' : ''}">hotfix</button></div></div>
      <div class="row"><span class="lbl">Short name</span><input type="text" id="bdSlug" placeholder="e.g. git-panel" autocomplete="off" spellcheck="false" /></div>
      <div class="row"><span class="lbl">From</span>${sha ? `<code>${sha.slice(0, 8)}</code><span class="sub" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(subj || '')}</span>`
        : `<select id="bdBase"><optgroup label="Local">${opt(local)}</optgroup><optgroup label="Remote">${opt(remote)}</optgroup></select>`}</div>
      ${wtOnly ? `<div class="gd-check"><span>A new branch is checked out in <code>.worktrees/&lt;short-name&gt;</code> of the main worktree. Every open tree keeps its branch.</span></div>`
        : `<label class="gd-check"><input type="checkbox" id="bdWt" ${f.worktree ? 'checked' : ''} />
        <span>Open in its own worktree <code>.worktrees/&lt;short-name&gt;</code> — the current tree keeps its branch</span></label>`}
      <div class="gd-name" id="bdName"></div></div>`,
    mount: (root, okB) => {
      preview();
      root.querySelector('#bdKind').onclick = (e) => {
        const b = e.target.closest('[data-kind]');
        if (!b) return;
        f.kind = b.dataset.kind;
        for (const x of root.querySelectorAll('[data-kind]')) x.classList.toggle('active', x === b);
        preview();
      };
      const slug = root.querySelector('#bdSlug');
      slug.oninput = () => { f.slug = slug.value; preview(); };
      slug.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) okB.click(); };
      const wt = root.querySelector('#bdWt');
      if (wt) wt.onchange = (e) => { f.worktree = e.target.checked; preview(); };

      if (sel) sel.onchange = () => { f.base = sel.value; };
    },

      if (f.slug.trim()) return true;

      return false;
    },
  });
  if (!ok) return;
  gitUi.kind = f.kind;
  if (!wtOnly) gitUi.worktree = f.worktree;
  gitSaveUi();
  gitAct('create', { kind: f.kind, slug: f.slug.trim(), worktree: f.worktree, ...(sha ? { sha } : { base: f.base }) });
}

function stampNow() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}-${p(d.getMinutes())}`;
}

async function gkAddGroupDialog() {
  let scan = null, seq = 0, named = false, newId = null, fetchNow = true;
  const fresh = () => scan ? scan.repos.filter((x) => !x.listed) : [];
  const ok = await gitDialog({
    title: 'Add project folder', ok: 'Add project', focus: '#gpPath',
    html: `<div class="sub">Every git repository inside the folder (up to 4 levels deep) is listed under one project name. Nothing on disk is changed.</div>
      <div class="gk-form">
        <div class="row"><input type="text" id="gpPath" placeholder="~/code" autocomplete="off" spellcheck="false" />
          <button type="button" id="gpPick">Browse…</button><button type="button" id="gpScan">Scan</button></div>
        <div class="gp-res" id="gpRes"></div>
        <div class="row"><span class="lbl">Name</span><input type="text" id="gpName" maxlength="60" autocomplete="off" spellcheck="false" placeholder="e.g. My product" /></div>
        <label class="gd-check"><input type="checkbox" id="gpFetch" checked /><span>Fetch every repository in the project after adding</span></label>
      </div>`,
    mount: (root, okB) => {
      const pathI = root.querySelector('#gpPath'), nameI = root.querySelector('#gpName'), res = root.querySelector('#gpRes');
      const sync = () => { okB.disabled = !fresh().length || !nameI.value.trim(); };
      const show = () => {
        if (!scan) { res.innerHTML = ''; return sync(); }
        if (scan.error) { res.innerHTML = `<div class="hd err">${esc(scan.error)}</div>`; return sync(); }
        const n = scan.repos.length, f = fresh().length;
        const head = !n ? 'No git repositories found in this folder.'
          : f === n ? `Found ${n} repositor${n > 1 ? 'ies' : 'y'}.`
          : f ? `Found ${n} repositories — ${n - f} already in the list stay where they are.` : `All ${n} repositor${n > 1 ? 'ies are' : 'y is'} already in the list.`;
        res.innerHTML = `<div class="hd${scan.already || !f ? ' err' : ''}">${scan.already ? `This folder is already in the list as “${esc(scan.already)}”.` : esc(head)}${scan.truncated ? ` Stopped at the scan limit (${scan.limit.repos} repositories, ${scan.limit.depth} levels).` : ''}</div>`
          + scan.repos.map((x) => `<div class="r${x.listed ? ' dup' : ''}" title="${esc(x.dir)}"><span class="p">${esc(x.rel)}</span><span class="b">${x.listed ? 'in ' + esc(x.listed) : esc(x.branch || '')}</span></div>`).join('');
        sync();
      };
      const run = async () => {
        const path = pathI.value.trim(), my = ++seq;
        if (!path) { scan = null; return show(); }
        res.innerHTML = '<div class="hd">Scanning…</div>'; okB.disabled = true;
        let r;
        try { r = await api('/api/git/groups/scan', { path }); } catch (e) { r = { error: e.message, repos: [] }; }
        if (my !== seq) return;
        if (r.already) r.repos = r.repos.map((x) => ({ ...x, listed: x.listed || r.already }));
        scan = r;
        if (!named && r.name) nameI.value = r.name;
        show();
      };
      pathI.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); run(); } };
      pathI.oninput = () => { seq++; scan = null; show(); };
      nameI.oninput = () => { named = !!nameI.value.trim(); sync(); };
      nameI.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && !okB.disabled) okB.click(); };
      root.querySelector('#gpScan').onclick = run;
      root.querySelector('#gpPick').onclick = async () => {
        try {
          const r = await api('/api/git/pick', {});
          if (r.cancelled) return;
          pathI.value = r.path; run();
        } catch (e) { toast(e.message); }
      };
      sync();
    },
    beforeOk: async () => {
      try {
        const r = await api('/api/git/groups', { path: scan.path, name: $('gpName').value });
        fetchNow = $('gpFetch').checked;
        gitList = r.list; gitGroups = r.groups; newId = r.id;
        return true;
      } catch (e) { toast(e.message); return false; }
    },
  });
  if (!ok) return;
  const g = gitGroups.find((x) => x.id === newId), repos = gitList.filter((r) => r.group === newId);
  toast(`Added ${g.name}: ${repos.length} repositor${repos.length > 1 ? 'ies' : 'y'}`);
  // Thêm từ trang tổng quan thì ở lại trang đó; thêm từ menu repo thì mở repo đầu của nhóm.
  if (repos[0] && gitView === 'repo') gkSelect(repos[0].id, '');
  if (fetchNow && repos.length) gitFetchAll(repos, g.name);
}

// ── Tổng quan các project ──
// Một lần gọi /api/git/overview cho mọi repo + worktree. Ô số liệu ở đầu trang là bộ lọc:
// bấm để chỉ còn repo khớp, bấm lại để bỏ. ↑↓ so với remote tính theo lần fetch gần nhất.
let gkDash = null, gkDashAt = 0, gkDashBusy = false, gkDashAgain = false, gkDashErr = '';
const gkDashOpen = new Set();   // repo đang mở danh sách worktree — chỉ trong phiên trang
const GD_DAY = 86400000;
const gdN = (s) => (s && !s.error ? s.files || 0 : 0);
function gdFacts(r) {
  const trees = [r.status, ...r.worktrees.map((w) => w.status)];
  return {
    dirtyTrees: trees.filter((s) => gdN(s) > 0).length,
    behind: trees.some((s) => !s.error && s.behind > 0),
    stale: r.remotes > 0 && (!r.fetchedAt || Date.now() - r.fetchedAt > GD_DAY),
    wtDirty: r.worktrees.filter((w) => gdN(w.status) > 0).length,
  };
}
const GD_FILTER = {
  all: () => true,
  dirty: (f) => f.dirtyTrees > 0,
  behind: (f) => f.behind,
  stale: (f) => f.stale,
  wt: (f, r) => r.worktrees.length > 0,
};
const gdPl = (n, one, many) => `${n} ${n === 1 ? one : many}`;

async function gkLoadDash() {
  if (gkDashBusy) { gkDashAgain = true; return; }
  gkDashBusy = true;
  if (!gkDash) gkRenderDash();
  gkRenderBar();
  try { gkDash = await api('/api/git/overview'); gkDashAt = Date.now(); gkDashErr = ''; } catch (e) { gkDashErr = e.message; }
  gkDashBusy = false;
  if (gkDashAgain) { gkDashAgain = false; return gkLoadDash(); }
  if (gitView === 'projects') { gkRenderDash(); gkRenderBar(); }
}

function gdChanges(s) {
  if (s.error) return `<span class="chip err" title="${esc(s.error)}">error</span>`;
  const out = [], mod = gdN(s) - (s.untracked || 0) - (s.conflicts || 0);
  if (s.op) out.push(`<span class="chip err">${esc(s.op)} in progress</span>`);
  if (s.conflicts) out.push(`<span class="chip err">${s.conflicts} conflicted</span>`);
  if (mod > 0) out.push(`<span class="chip warn">${mod} modified</span>`);
  if (s.untracked) out.push(`<span class="chip">${s.untracked} new</span>`);
  return out.join(' ') || '<span class="f">clean</span>';
}
function gdSync(s, remotes) {
  if (s.error) return '';
  if (!remotes) return '<span class="f">no remote</span>';
  if (!s.upstream) return s.branch ? '<span class="f">no upstream</span>' : '';
  if (!s.ahead && !s.behind) return '<span class="f">up to date</span>';
  return abMini(s.ahead, s.behind);
}
const gdBranch = (s) => (s.error ? '' : esc(s.branch || (s.detached ? 'detached' : '')));
const gdLast = (l) => (l
  ? `<span title="${esc(l.author)} · ${esc(gkFull(l.when))}">${gkWhen(l.when)}</span><span class="subj" title="${esc(l.subject)}">${esc(l.subject)}</span>`
  : '<span class="f">no commits</span>');

function gdRows(r, f) {
  const s = r.status, open = gkDashOpen.has(r.id) || gitUi.dashF === 'wt', n = r.worktrees.length;
  const fetched = !r.remotes ? '<span class="f">—</span>'
    : r.fetchedAt ? `<span class="${f.stale ? 'w' : ''}" title="${esc(new Date(r.fetchedAt).toLocaleString('en-GB'))}">${since(r.fetchedAt / 1000)}</span>`
    : '<span class="w">never</span>';
  const head = `<tr data-open="${esc(r.id)}" title="${esc(r.dir)}">
    <td><span class="nm">${esc(r.label)}</span>${r.readOnly ? ' <span class="chip ro">read-only</span>' : ''}</td>
    <td class="br" title="${gdBranch(s)}">${gdBranch(s)}</td>
    <td>${gdChanges(s)}</td>
    <td>${gdSync(s, r.remotes)}</td>
    <td>${fetched}</td>
    <td class="lc">${gdLast(r.last)}</td>
    <td>${n ? `<button class="gd-wtb ${open ? '' : 'shut'}" data-wtx="${esc(r.id)}" title="${open ? 'Hide' : 'Show'} worktrees">${ic('down')}${n}${f.wtDirty ? ` · ${f.wtDirty} changed` : ''}</button>` : '<span class="f">—</span>'}</td>
    <td class="rm"><button class="gd-rm" data-drop="${esc(r.id)}" title="Remove from the list">${ic('x')}</button></td>
  </tr>`;
  if (!open || !n) return head;
  return head + gkSortedWts(r.worktrees).map((w) => `<tr class="wt" data-open="${esc(r.id)}" data-wt="${esc(w.rel)}" title="${esc(w.rel)}">
    <td>${esc(wtShort(w.rel))}${w.locked ? ' <span class="chip ro">locked</span>' : ''}</td>
    <td class="br" title="${gdBranch(w.status)}">${gdBranch(w.status)}</td>
    <td>${gdChanges(w.status)}</td>
    <td>${gdSync(w.status, r.remotes)}</td>
    <td class="f">${w.created ? 'created ' + since(w.created / 1000) : ''}</td>
    <td class="lc">${gdLast(w.last)}</td>
    <td></td><td></td>
  </tr>`).join('');
}

function gkRenderDash() {
  const el = $('gkDash');
  if (!gkDash) {
    el.innerHTML = `<div class="gd-empty">${gkDashErr ? esc(gkDashErr) : 'Reading every repository and worktree…'}</div>`;
    return;
  }
  const fk = GD_FILTER[gitUi.dashF] ? gitUi.dashF : 'all', pass = GD_FILTER[fk];
  const all = gkDash.repos.map((r) => ({ r, f: gdFacts(r) }));
  const cnt = (k) => all.filter((x) => GD_FILTER[k](x.f, x.r)).length;
  const sum = (fn) => all.reduce((a, x) => a + fn(x), 0);
  const secs = [
    ...gkDash.groups.map((g) => ({ key: g.id, name: g.name, path: g.path, g, rows: all.filter((x) => x.r.group === g.id) })),
    { key: 'extra', name: 'Other repositories', rows: all.filter((x) => x.r.extra) },
  ].filter((p) => p.rows.length || p.g);
  const stale = all.filter((x) => x.r.remotes > 0).map((x) => x.r.fetchedAt || 0);
  const oldest = stale.length ? Math.min(...stale) : null;
  const nWt = sum((x) => x.r.worktrees.length);
  const tiles = [
    ['all', 'Repositories', all.length, gdPl(secs.filter((p) => p.key !== 'extra').length, 'project', 'projects')],
    ['dirty', 'Uncommitted changes', cnt('dirty'), gdPl(sum((x) => x.f.dirtyTrees), 'working tree', 'working trees')],
    ['behind', 'Behind remote', cnt('behind'), 'as of the last fetch'],
    ['stale', 'Not fetched in 24h', cnt('stale'), oldest === null ? 'no remotes' : oldest === 0 ? 'some never fetched' : 'oldest ' + since(oldest / 1000)],
    ['wt', 'Worktrees', nWt, `${sum((x) => x.f.wtDirty)} with changes`],
  ];
  const body = secs.map((p) => {
    const rows = p.rows.filter((x) => pass(x.f, x.r));
    if (fk !== 'all' && !rows.length) return '';
    const nd = p.rows.filter((x) => x.f.dirtyTrees).length, nb = p.rows.filter((x) => x.f.behind).length;
    const st = [gdPl(p.rows.length, 'repository', 'repositories'), nd && `${nd} with changes`, nb && `${nb} behind`].filter(Boolean).join(' · ');
    return `<section class="gd-proj">
      <div class="gd-ph">
        <div class="t"><h3>${esc(p.name)}${p.tag ? ` <span class="chip">${p.tag}</span>` : ''}${p.g?.missing ? ' <span class="chip err">folder not found</span>' : ''}</h3>
          ${p.path ? `<div class="p" title="${esc(p.path)}">${esc(p.path)}${p.g?.addedAt ? ` · added ${gkWhen(p.g.addedAt / 1000)}` : ''}</div>` : ''}</div>
        <span class="st">${st}</span>
        <button data-dact="fetch" data-key="${esc(p.key)}" ${gitBusy || !p.rows.length ? 'disabled' : ''}>Fetch all</button>
        ${p.g ? `<button class="more" data-dact="more" data-key="${esc(p.key)}" title="More">${ic('more')}</button>` : ''}
      </div>
      ${rows.length ? `<div class="gd-scroll"><table class="gd-t">
        <thead><tr><th>Repository</th><th>Branch</th><th>Changes</th><th>Remote</th><th>Last fetch</th><th>Last commit</th><th>Worktrees</th><th></th></tr></thead>
        <tbody>${rows.map((x) => gdRows(x.r, x.f)).join('')}</tbody></table></div>`
        : '<div class="gd-empty">No repositories — rescan the folder or remove the project.</div>'}
    </section>`;
  }).join('');
  el.innerHTML = `<div class="gd-wrap">
    <div class="gd-head"><div class="t"><h2>Projects</h2>
      <div class="sub">Every repository in the list, with its worktrees. Ahead/behind counts are as of each repository's last fetch.</div></div>
      <div class="gd-acts">${MN.on ? '<button data-dact="clone">Clone from URL…</button>' : ''}<button data-dact="add">Add project folder…</button></div></div>
    <div class="gd-tiles">${tiles.map(([k, label, v, s]) => `<button class="gd-tile ${fk === k ? 'on' : ''}" data-dtile="${k}" aria-pressed="${fk === k}"
      title="${k === 'all' ? 'Show every repository' : 'Show only these — click again to show all'}">
      <span class="k">${k !== 'all' && k !== 'wt' && v ? '<i></i>' : ''}${label}</span><span class="v">${v}</span><span class="s">${esc(s)}</span></button>`).join('')}</div>
    ${body || '<div class="gd-empty">Nothing here — every repository is clear for this filter.</div>'}
  </div>`;
}

// ── Chạy lệnh ──
let gitPlanning = false;   // đang chờ dry-run hoặc đang mở hộp xác nhận
async function gitAct(op, extra = {}) {
  if (!gitSel || gitBusy || gitPlanning) return;
  const body = { repo: gitSel.repo, wt: gitSel.wt || '', op, ...extra };
  if (!GIT_QUICK.has(op)) {
    gitPlanning = true;
    let plan;
    try {
      try { plan = await api('/api/git/run', { ...body, dryRun: true }); } catch (e) { return toast(e.message); }
      plan = await gitConfirm(plan, op, body);
    } finally { gitPlanning = false; }
    if (!plan) return;
    body.expect = plan.expect;   // server dừng nếu HEAD (hay tệp đã stage) đổi so với lúc xem hộp này
    if (plan.ack) body.ack = true;
  }
  return gitExec(body);
}

// Tiến độ lệnh đang chạy (push in "Writing objects 45%"…), hỏi server mỗi 500ms trong lúc chờ /api/git/run.
let gitRunProg = null;
function gkRunText() {
  const p = gitRunProg;
  if (p?.phase) return `<span title="${esc(p.line)}">${esc(p.phase)}${p.pct != null ? ` ${p.pct}%<span class="gk-prog"><i style="width:${p.pct}%"></i></span>` : '…'}</span>`;
  return p?.of > 1 ? `Running ${p.step}/${p.of}…` : 'Running…';
}

async function gitExec(body) {
  gitBusy = true;
  gkRenderBar();
  gkCommitState();
  let res = null, live = true;
  const poll = setInterval(async () => {
    let p;
    try { p = (await api(`/api/git/progress?repo=${encodeURIComponent(body.repo)}`)).running; } catch { return; }
    if (!live) return;
    gitRunProg = p;
    const sub = $('gkRunSub');
    if (sub) sub.innerHTML = gkRunText();
  }, 500);
  try { res = await api('/api/git/run', body); } catch (e) { toast(e.message); }
  live = false; clearInterval(poll); gitRunProg = null;
  gitBusy = false;
  if (res?.block) toast(res.block);
  else if (res) {
    const quiet = body.op === 'stage' || body.op === 'unstage';
    if (!res.ok) toast(`${res.title} — failed, see Command history`);
    else if (res.warn?.length && quiet) toast(res.warn[0]);
    else if (!quiet) toast(`${res.title} — done`);
    if (res.ok && (body.op === 'commit' || body.op === 'ship')) { delete gitMsgs[`${body.repo}|${body.wt}`]; gitPick = null; }
    // Merge vào develop vướng xung đột: mở worktree develop để sửa rồi Continue (hoặc Abort).
    if (res.conflictWt != null) { gkSelect(body.repo, res.conflictWt); toast('Merge into develop has conflicts — fix them here, then Continue or Abort'); }
    if (res.ok && body.op === 'create' && res.newWt) { gitSel = { repo: body.repo, wt: res.newWt }; gitSaveSel(); }
    // Worktree vừa gỡ (kể cả khi bước xoá nhánh sau đó lỗi): đang xem nó thì về cây chính.
    if (res.removedWt) {
      delete gitMsgs[`${body.repo}|${res.removedWt}`];
      if (gitSel.repo === body.repo && gitSel.wt === res.removedWt) { gitSel = { repo: body.repo, wt: '' }; gitSaveSel(); gitPick = null; }
    }
    if (!res.ok) { gitUi.histOpen = true; gitUi.panel = 'hist'; gitSaveUi(); }
    gitHistKey = `${res.t}|${res.repo}`;
    gitLoadHistory();
  }
  gitSig = '';
  await gitLoadList();
}

async function gitFetchAll(list = gitList, name = '') {
  if (gitBusy || !list.length) return;
  gitBusy = true;
  gkRenderBar();
  const queue = [...list], tag = name ? name + ': ' : '';
  let done = 0, bad = 0;
  // Bốn repo một lượt: nhanh hơn chạy lần lượt mà không dồn cả chục kết nối SSH cùng lúc.
  await Promise.all(Array.from({ length: 4 }, async () => {
    for (let r; (r = queue.shift());) {
      try { if (!(await api('/api/git/run', { repo: r.id, op: 'fetch' })).ok) bad++; } catch { bad++; }
      toast(`${tag}Fetch ${++done}/${list.length}…`);
    }
  }));
  gitBusy = false;
  toast(bad ? `${tag}Fetch done, ${bad} repositor${bad > 1 ? 'ies' : 'y'} failed — see Command history` : `${tag}All repositories fetched`);
  if (bad) { gitUi.histOpen = true; gitUi.panel = 'hist'; gitSaveUi(); }
  gitHistKey = null;
  gitLoadHistory();
  gitSig = '';
  gitLoadList();
  if (gitView === 'projects') gkLoadDash();
}

// ── Lệnh đã chạy ──
async function gitLoadHistory() {
  try { gitHist = await api('/api/git/history'); } catch { return; }
  gitRenderHistory();
}
// Khay dưới có hai tab: Command history và Terminal (tab này chỉ có khi còn shell). gitUi.panel là

  $('gkHistH').innerHTML = `${ic('down', 'gk-tw' + (open ? '' : ' shut'))}${tab('hist', 'Command history', gitHist.length, 'Git commands run from this page')}${
    GT.tabs.length ? tab('term', 'Terminal', GT.tabs.length, 'Shells running in the bottom panel (⌃`)') : ''}${p === 'term'
      ? `<div class="gt-tabs">${GT.tabs.map((t) => `<button class="gt-tab${t.id === GT.active ? ' on' : ''}" data-gtab="${esc(t.id)}" title="${esc(t.cwd)}">${ic('term')}<span class="nm">${esc(gtLabel(t.cwd))}</span><span class="x" data-gclose="${esc(t.id)}" title="Kill this shell">${ic('x')}</span></button>`).join('')}</div><button class="gt-btn" data-gt="new" title="New terminal in the repository / worktree you are viewing">${ic('plus')}</button>`
      : h0 ? `<span class="pill ${h0.ok ? 'ok' : 'err'}">${h0.ok ? 'Done' : 'Failed'}</span>
        <span class="last">${esc(h0.title)} · ${esc(h0.repo)}${h0.wt ? ' · ' + esc(wtShort(h0.wt)) : ''}</span><span class="faint">${clock(h0.t)}</span>`
        : '<span class="last faint">No commands run in this server session yet.</span>'}${gkModeSw()}`;
  $('gkHistB').innerHTML = `${gitHist.slice(0, 20).map((h, i) => {

          <span class="t">${clock(h.t)}</span></div>
        <div class="gh-body">${h.steps.map((st, j) => `${st.where && st.where !== h.steps[j - 1]?.where ? `<div class="at"># ${esc(st.where)}</div>` : ''}<div class="c ${st.code ? 'bad' : ''}">$ ${esc(st.cmd)}${st.code ? ` → exit ${esc(st.code)}` : ''}</div>${
          st.out ? `<pre>${esc(st.out)}</pre>` : ''}`).join('')}</div></div>`;
    }).join('')}`;
}

// Vẽ lại mà không làm mất chỗ con trỏ đang gõ (trang tự đọc lại 10 giây một lần).
function keepFocus(root, render) {
  const a = document.activeElement;
  const id = a && root.contains(a) ? a.id : null;
  const range = id && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  render();
  const b = id && $(id);
  if (b) { b.focus(); if (range) try { b.setSelectionRange(...range); } catch {} }
}

        act: () => gkBranchDialog({ wtOnly: true, ...(br !== 'detached' ? { base: br } : {}) }) },
      // Cây chính không gỡ được — không hiện mục.
      w.dataset.wt && { label: 'Remove worktree…', danger: true, disabled: gitBusy || !!gitD.readOnly, act: () => gkRemoveWtDialog(w.dataset.wt, br, path) }]);
  }
  const b = e.target.closest('[data-br]');
  if (b) { e.preventDefault(); return gkBranchMenu(e, b.dataset.br, !!b.dataset.remote); }
  const st = e.target.closest('[data-stash]');
  if (st) {
    e.preventDefault();
    const x = gitD.stash.find((s) => s.hash === st.dataset.stash);
    if (!x) return;
    gitMenu(e, [{ hd: x.ref }, { label: 'Pop this stash', disabled: gitBusy || !!gitD.readOnly, act: () => gitAct('pop', { hash: x.hash }) }]);
  }
});

$('gkRows').addEventListener('click', (e) => {
  const r = e.target.closest('.gk-row');
  if (r) gkPickSha(r.dataset.sha);
});
$('gkRows').addEventListener('dblclick', (e) => {
  const p = e.target.closest('.gk-ref');
  if (p && (p.dataset.kind === 'local' || p.dataset.kind === 'remote')) gkSwitchTo(p.dataset.ref, p.dataset.kind === 'remote');
});
$('gkRows').addEventListener('contextmenu', (e) => {
  const p = e.target.closest('.gk-ref');
  if (p && (p.dataset.kind === 'local' || p.dataset.kind === 'remote')) { e.preventDefault(); return gkBranchMenu(e, p.dataset.ref, p.dataset.kind === 'remote'); }
  const r = e.target.closest('.gk-row');
  if (!r || r.dataset.sha === 'wip') return;
  e.preventDefault();
  gkPickSha(r.dataset.sha);
  gkCommitMenu(e, r.dataset.sha);
});
$('gkMore').addEventListener('click', (e) => {
  if (!e.target.closest('[data-more]')) return;
  gitN += 300;
  gitSig = '';
  gitLoadDetail();
});

$('gkRight').addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) { gitUi.view = v.dataset.view; gitSaveUi(); return gkRenderRight(); }
  const tr = e.target.closest('[data-tree]');
  if (tr) {
    for (const k of gkDirKeys) tr.dataset.tree === 'shut' ? gkFileShut.add(k) : gkFileShut.delete(k);
    return gkRenderRight();
  }
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a.disabled) return;
    const row = a.closest('.gk-file');
    return gitAct(a.dataset.act, { paths: row.dataset.dir ? gkDirFiles.get(row.dataset.dir) : [row.dataset.path] });
  }
  const all = e.target.closest('[data-all]');
  if (all) return all.disabled ? null : gitAct(all.dataset.all, { all: true });
  const gen = e.target.closest('[data-gen]');
  if (gen) return gen.disabled ? null : gkGenerate();
  if (e.target.closest('[data-ident]')) return gkIdentityDialog();
  const g = e.target.closest('[data-git]');
  if (g) {
    if (g.disabled) return;
    const op = g.dataset.git;
    if (op === 'commit') return gkCommit();
    if (op === 'pop-this') return gitAct('pop', { hash: g.dataset.hash });
    if (op === 'branch-here') return gkBranchDialog({ sha: gitPick });
    return gitAct(op);   // continue · abort
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) return copy(cp.dataset.copy, 'SHA copied');
  const par = e.target.closest('[data-par]');
  if (par) return gkPickSha(par.dataset.par, true);
  const dr = e.target.closest('.gk-file.dir');
  if (dr) {
    const k = dr.dataset.key;
    gkFileShut.has(k) ? gkFileShut.delete(k) : gkFileShut.add(k);
    return gkRenderRight();
  }
  const f = e.target.closest('.gk-file:not(.dir)');
  if (f) gkOpenDiff({ path: f.dataset.path, staged: f.dataset.staged === '1', sha: f.dataset.sha || null, st: f.dataset.st });
});
$('gkRight').addEventListener('input', (e) => {
  const id = e.target.id;
  if (id !== 'gkSum' && id !== 'gkDesc') return;
  const m = (gitMsgs[gitKey] ||= { summary: '', desc: '' });
  m[id === 'gkSum' ? 'summary' : 'desc'] = e.target.value;
  gkCommitState();
});
$('gkRight').addEventListener('keydown', (e) => {
  const id = e.target.id;
  if (id !== 'gkSum' && id !== 'gkDesc') return;
  if (e.isComposing || e.keyCode === 229) return;   // Enter đang chốt chữ của bộ gõ (Telex/VNI)
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); gkCommit(); }
  else if (e.key === 'Enter' && id === 'gkSum') { e.preventDefault(); $('gkDesc').focus(); }
});

// Thẻ hover của worktree: tên, nhánh, lúc tạo, đường dẫn. Hiện sau 250ms, đứng cạnh phải thanh trái.
let gkTipT = null;
function gkTipHide() { clearTimeout(gkTipT); $('gkTip').hidden = true; delete $('gkTip').dataset.for; }
function gkTipShow(it) {
  // Trống = server chạy bản cũ chưa gửi giờ tạo; 0 = server không đọc được cả .git lẫn thư mục.
  const tip = $('gkTip'), c = +it.dataset.created, main = !it.dataset.wt;
  const when = c ? `${new Date(c).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`
    + ` <span class="rel">· ${since(c / 1000)}</span>` : `<span class="rel">${it.dataset.created === '' ? 'unknown · restart the run server' : 'unknown'}</span>`;
  tip.innerHTML = `<div class="h">${esc(it.querySelector('.nm')?.textContent || '')}</div><dl>
    <dt>Branch</dt><dd class="mono">${esc(it.querySelector('.w')?.textContent || '')}</dd>
    <dt>${main ? 'Cloned' : 'Created'}</dt><dd>${when}</dd>
    <dt>Path</dt><dd class="mono">${esc(it.dataset.path || '')}</dd></dl><div class="ft">Right-click to copy name, branch or path</div>`;
  tip.dataset.for = it.dataset.wt;
  tip.hidden = false;
  const r = it.getBoundingClientRect(), side = document.querySelector('.gk-side').getBoundingClientRect();
  tip.style.left = Math.min(side.right + 8, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(8, Math.min(r.top - 6, innerHeight - tip.offsetHeight - 8)) + 'px';
}
$('gkTree').addEventListener('mouseover', (e) => {
  const it = e.target.closest('.gk-item[data-wt]');
  if (!it) return gkTipHide();
  if (!$('gkTip').hidden && $('gkTip').dataset.for === it.dataset.wt) return;
  clearTimeout(gkTipT);
  gkTipT = setTimeout(() => it.isConnected && gkTipShow(it), 250);
});
$('gkTree').addEventListener('mouseleave', gkTipHide);
$('gkTree').addEventListener('mousedown', gkTipHide);
document.querySelector('.gk-side').addEventListener('scroll', gkTipHide);

$('gkDiff').addEventListener('click', (e) => {
  const v = e.target.closest('[data-dview]');
  if (v) { gitUi.htmlView = v.dataset.dview; gitSaveUi(); return gkRenderDiff(); }
  const b = e.target.closest('[data-dact]');
  if (!b || b.disabled) return;
  if (b.dataset.dact === 'close') return gkCloseDiff();
  if (b.dataset.dact === 'openweb') return window.open(gkWebUrl(gitDiffOpen), '_blank');
  gitAct(b.dataset.dact, { paths: [gitDiffOpen.path] });
});

$('gkHist').addEventListener('click', (e) => {
  const md = e.target.closest('[data-mode]');
  if (md) return md.dataset.mode !== gitUi.mode && gkSetMode(md.dataset.mode);
  const x = e.target.closest('[data-gclose]');
  if (x) return gtClose(x.dataset.gclose, true);
  const tb = e.target.closest('[data-gtab]');
  if (tb) return gtPick(tb.dataset.gtab);
  if (e.target.closest('[data-gt="new"]')) return gtNew(gtRoot());
  // Bấm tab đang mở thì đóng khay; tab khác thì mở khay ở tab đó.
  const pt = e.target.closest('[data-panel]');
  if (pt) {
    if (pt.dataset.panel === 'term') return gtShow(!gtOpen());
    gitUi.histOpen = !(gitUi.histOpen && gkPanel() === 'hist');
    gitUi.panel = 'hist';
    gitSaveUi();
    return gtSync();
  }
  if (e.target.closest('#gkHistH')) {
    gitUi.histOpen = !gitUi.histOpen;
    gitSaveUi();
    return gtSync();
  }
  const h = e.target.closest('.gh-head');
  if (!h) return;
  const item = h.parentElement;
  item.classList.toggle('open');
  gitHistKey = item.classList.contains('open') ? item.dataset.key : null;
});

// Esc đóng menu rồi tới diff; ↑ ↓ đi qua các hàng của đồ thị.
document.addEventListener('keydown', (e) => {
  if ($('gitDlg').open) return;
  if (e.key === 'Escape') {
    if (gkMenuEl) return gitMenuClose();
    if (gitDiffOpen) return gkCloseDiff();
  }
  // Chế độ Files: ⌘P tìm tệp theo tên như VS Code; mũi tên không đi qua đồ thị đang ẩn.
  if (gitUi.mode === 'files' && gitView === 'repo') {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'p') { e.preventDefault(); $('exFilter').focus(); $('exFilter').select(); }
    return;
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.target.closest('input, textarea, select')) {
    const rows = [...document.querySelectorAll('#gkRows .gk-row')];
    if (!rows.length) return;
    const i = rows.findIndex((r) => r.dataset.sha === gitPick);
    const nx = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    e.preventDefault();
    if (nx && nx.dataset.sha !== gitPick) gkPickSha(nx.dataset.sha, true);
  }
});


if (location.protocol === 'file:') toast('Open this page through the server: node tools/git-server.mjs');
else gitOpen();
</script>
